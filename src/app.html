<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.webmanifest"
			crossorigin="use-credentials"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="theme-color" content="#dd5822" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="FamilyPlanz" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// The test environment wears the blue envelope (static/test-*, rendered
			// by scripts/build-brand-rasters.mjs) so it is obvious which tab and
			// which home-screen install is which. Production keeps the terracotta
			// art untouched at every path below.
			if (/(^|\.)test\.familyplanz\.com$/.test(window.location.hostname)) {
				document.querySelector('link[rel="icon"]').href = '/test-icon.svg';
				document.querySelector('link[rel="apple-touch-icon"]').href =
					'/test-apple-touch-icon.png';
				document.querySelector('link[rel="manifest"]').href = '/test-manifest.webmanifest';
				document.querySelector('meta[name="theme-color"]').content = '#366d7e';
			}
		</script>
		<script>
			try {
				const isProd = !/(^|\.)(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
				if ('serviceWorker' in navigator && isProd) {
					window.addEventListener('load', () => {
						navigator.serviceWorker.register('%sveltekit.assets%/service-worker.js');
					});
				}
			} catch {
				// service worker registration is best-effort
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
