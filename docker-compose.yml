# Local Postgres for development + testing.
#
# Usage:
#   npm run db:up        # start (port 5433, data survives restarts)
#   npm run db:down      # stop
#   npm run db:reset     # stop + wipe volumes (fresh schema needed)
#   npm run db:push      # apply drizzle schema to the dev DB
#   npm run db:push:test # apply drizzle schema to the test DB
#   npx tsx src/lib/server/seed.ts   # seed subscription types + ad events
#
# Ports: 5432/5434 are taken by other project containers on this machine,
# so this stack exposes 5433. DATABASE_URL points there via .env.local
# (gitignored) — see .env.example for the shape.
services:
  db:
    image: postgres:16-alpine
    container_name: familycalendar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: familycalendar
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d familycalendar']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
