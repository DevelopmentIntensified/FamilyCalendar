/* ── feedback tallies, straight from the shared store ───────────────── */
const STORE = 'proto-fb:v1';
function tally(file) {
	try {
		const all = JSON.parse(localStorage.getItem(STORE) || '{}');
		const rec = (all.pages || {})[file];
		if (!rec) return null;
		const items = (rec.rounds || []).flatMap((r) => r.items || []);
		if (!items.length) return null;
		const n = (v) => items.filter((i) => i.verdict === v).length;
		const rounds = (rec.rounds || []).length;
		return { good: n('good'), bad: n('bad'), idea: n('idea'), rounds };
	} catch (e) { return null; }
}
function badges(file) {
	const t = tally(file);
	if (!t) return '<span class="tally t-none">not reviewed</span>';
	const bits = [];
	if (t.good) bits.push(`<span class="tally t-good" title="marked good">${t.good} good</span>`);
	if (t.bad)  bits.push(`<span class="tally t-bad" title="marked bad — the rebuild queue">${t.bad} redo</span>`);
	if (t.idea) bits.push(`<span class="tally t-idea" title="ideas">${t.idea} idea</span>`);
	if (t.rounds > 1) bits.push(`<span class="rd" title="review rounds">r${t.rounds}</span>`);
	return bits.join(' ');
}

/* ── review state, from the shared module ────────────────────────────────
   The review system is portable: the registry lives in the project's root,
   the checker and the tree renderer come from the skill. This page only
   supplies the page list and its own fallbacks.

   Loaded with a DYNAMIC import inside an async IIFE — not a static import,
   and not a top-level await: the checkers in this project evaluate this file
   as a single CLASSIC script with import statements stripped, where both are
   syntax errors. A static import left `reviewState` undefined and the tree
   blank; a top-level await threw "Unexpected token". Degrade to an empty
   registry rather than throw — the rule the overlay follows for a missing
   collector. */
let REVIEW = new Map();
let refreshReview = null;
(async () => {
	try {
		const mod = await import('./review-tree.js');
		refreshReview = () =>
			mod.mountReviewState({ totals: document.getElementById('tallies'), total: ALL_FILES.length });
		REVIEW = mod.reviewState();
		await refreshReview();
		repaintReview();
		paintTallies();
		refreshLockBar();
	} catch (e) {
		/* standalone tree: no registry, badges fall back to the per-browser store */
	}
})();

function badgeFor(file) {
	const r = REVIEW.get(file);
	if (!r) return '';
	if (r.approved) {
		return `<span class="tally t-good" title="approved in the review tool${r.approvedAt ? ' · ' + String(r.approvedAt).slice(0, 10) : ''}">approved</span>`;
	}
	if (r.state === 'unreviewed') return '<span class="tally t-none">not reviewed</span>';
	const label = { approved: 'approved', 'changes-requested': 'changes requested', rebuild: 'to rebuild' }[r.outcome] ?? r.state;
	const cls = r.outcome === 'approved' ? 't-good' : r.outcome === 'rebuild' ? 't-bad' : 't-idea';
	const tickets = (r.tickets ?? []).map((t) => `#${t}`).join(' ');
	return (
		`<span class="tally ${cls}" title="review outcome: ${r.outcome}${r.closed ? '' : ' · round still open'}` +
		`${tickets ? ' · ' + tickets : ''}">${label}</span>` +
		(r.closed ? '' : ' <span class="rd" title="the review round is still open">open</span>')
	);
}

/* The registry wins; the per-browser store only fills in for a page it has no
   entry for, so a node can never say "not reviewed" AND "approved". */
function repaintReview() {
	document.querySelectorAll('.node[data-file]').forEach((n) => {
		const slot = n.querySelector('[data-badge-slot]');
		if (!slot) return;
		const f = n.dataset.file;
		slot.innerHTML = REVIEW.has(f) ? badgeFor(f) : badges(f);
	});
}

/* id → the pane it shows. One registry, one rule: exactly the active pane is

const PANES = {};
function pane(id) {
	const p = document.createElement('div');
	p.setAttribute('data-pane', id);   // so a test can tell a view from the chrome

}
function show(id) {

</div>`;

/* ── view 1: the lineup, as a tree ───────────────────────────────────── */
function setNode(t, cls) {
	const n = document.createElement('a');
	n.className = 'node ' + cls;
	n.href = t.file;
	n.dataset.file = t.file;
	n.style.textDecoration = 'none';
	n.innerHTML = `<span class="node__t">${t.name}</span>
		<span class="node__m">${t.file}</span>
		<span data-badge-slot>${badges(t.file)}</span>`;
	return n;
}
function li(t, cls) {
	const l = document.createElement('li');
	l.className = cls;
	l.appendChild(setNode(t, cls));
	if (t.note) {
		const q = document.createElement('div');
		q.className = 'node__q';
		q.textContent = t.note;
		l.appendChild(q);
	}
	if (t.route) {
		const r = document.createElement('div');
		r.className = 'route';
		r.style.paddingLeft = '1.5rem';
		r.textContent = t.route;
		l.appendChild(r);
	}
	return l;
}
const lineup = pane('lineup');
lineup.className = 'rail__card tree';
lineup.setAttribute('data-fb', 'tree-lineup');
lineup.setAttribute('data-fb-label', 'The tree');
const root = document.createElement('ul');
[['calendar', 'folder'], ['app', 'folder']].forEach(([key, cls]) => {
	const set = TREE[key];
	const l = document.createElement('li');
	l.className = cls;
	l.innerHTML = `<div class="node">
		<span class="node__t">${set.label}</span>
		<span class="node__m">${set.prototypes.length} pages</span>
		<a class="pill pill-xs pill-token" href="${set.href}" style="text-decoration:none">hub →</a>
		${badges(set.href)}
	</div>
	<div class="node__q" style="padding-left:0">${set.blurb}</div>`;
	const ul = document.createElement('ul');
	set.prototypes.forEach((p) => ul.appendChild(li(p, 'file')));
	l.appendChild(ul);
	root.appendChild(l);
});
lineup.appendChild(root);
PANES.lineup = lineup;
body.appendChild(lineup);

/* ── view 2: the lineage ─────────────────────────────────────────────── */
const lineage = pane('lineage');
lineage.className = 'lin';
lineage.setAttribute('data-fb', 'tree-lineage');
lineage.setAttribute('data-fb-label', 'How D was built');
const N = TREE.calendar.prototypes;
[[N[0], 'Start'], [N[1], 'Round 1'], [N[2], 'Round 1'], [N[3], 'Round 1'], [N[4], 'Round 1 → 2']].forEach(([p, when], i, arr) => {
	const cls = p.role === 'baseline' ? 'is-base' : p.role === 'synthesis' ? 'is-win' : 'is-loss';
	const box = document.createElement('div');
	box.className = 'card step-node ' + cls;
	box.innerHTML = `
		<div class="step-node__k">${when}</div>
		<div style="font-size:1.0625rem;font-weight:800;color:var(--s900);margin-top:.25rem">${p.name}</div>
		<div class="rowflex gap-2" style="margin-top:.5rem">
			<span class="pill pill-xs ${ROLE[p.role][1]}">${ROLE[p.role][2]}</span>
			${badges(p.file)}
		</div>
		<p class="hint" style="line-height:1.7;margin:.75rem 0 0">${p.note}</p>
		<a class="btn btn-soft btn-sm" href="${p.file}" style="margin-top:.875rem">Open</a>
		<div class="route">${p.file}</div>`;
	lineage.appendChild(box);
	if (i < arr.length - 1) {
		const a = document.createElement('div');
		a.className = 'arrow';
		a.textContent = '↓';
		lineage.appendChild(a);
	}
});
PANES.lineage = lineage;
body.appendChild(lineage);

/* the synthesis card lives inside the lineage view, not beside it */
const why = document.createElement('div');
why.className = 'rail__card';
why.style.cssText = 'grid-column:1/-1;background:linear-gradient(140deg,rgba(196,233,218,.4),#fff);border-color:transparent';
why.setAttribute('data-fb', 'why-synthesis');
why.setAttribute('data-fb-label', 'Why a synthesis and not a patch');
why.innerHTML = `
	<div class="rail__title">Why D is a synthesis, not a patch</div>
	<p class="hint" style="line-height:1.8;margin:.625rem 0 0">Round 1 pointed one way: the rail was worth keeping
	and the day hero was not. Patching A, B or C into shape would have destroyed the record of what each one
	actually argued, and the evidence is the only thing that tells you <em>why</em> the result looks like it does.</p>
	<p class="hint" style="line-height:1.8;margin:.5rem 0 0">So the losers stayed on disk, untouched, and a fourth
	page was built from the parts that won. A and B are not deprecated — they are the argument.</p>
	<p class="hint" style="line-height:1.8;margin:.5rem 0 0">The one shared root cause: the toolbar was carrying
	both the controls and the key. Splitting them — a row of controls, and a slim strip sharing a border with the
	grid — fixed the complaint against all three at once, which is the tell that it was one problem and not three.</p>`;
lineage.appendChild(why);

/* ── view 3: files on disk ───────────────────────────────────────────── */
const filesPane = pane('files');
filesPane.style.cssText += 'gap:1rem;align-items:start';
filesPane.setAttribute('data-fb', 'tree-files');
filesPane.setAttribute('data-fb-label', 'What is on disk');
const fileCol = document.createElement('div');
fileCol.style.cssText = 'display:flex;flex-direction:column;gap:1rem';
Object.entries(FILES).forEach(([dir, rows]) => {
	const c = document.createElement('div');
	c.className = 'rail__card';
	c.innerHTML = `<div class="rail__title" style="justify-content:space-between">
		<span>${dir}/</span><span class="hint">${rows.length} entries</span></div>` +
		rows.map(([n, kind, what]) => `
		  <div class="frow">
		    <span class="swatch" style="background:${kind === 'test' ? '#5b9fb5' : kind === 'overlay' ? '#8d7aa8' : kind === 'doc' || kind === 'scratch' ? '#94a3b8' : kind === 'style' ? '#e87539' : kind === 'engine' ? '#4d9c85' : '#c45e38'}"></span>
		    <span class="frow__n">${n}</span>
		    <span class="hint" style="flex:1;min-width:0">${what}</span>
		    <span class="frow__r">${kind}</span>
		    ${n.endsWith('.html') ? `<a class="pill pill-xs pill-token" href="${dir}/${n}" style="text-decoration:none">open</a>` : ''}
		  </div>`).join('');
	fileCol.appendChild(c);
});
filesPane.appendChild(fileCol);
body.appendChild(filesPane);

/* the switch needs to know about the extra panes */
views.addEventListener('click', () => {
	why.style.display = [...views.querySelectorAll('button')].some((b, i) => b.classList.contains('is-on') && i === 1) ? '' : 'none';
});

/* ── the rules this tree encodes ─────────────────────────────────────── */
const rules = document.createElement('div');
rules.className = 'rail__card';
rules.setAttribute('data-fb', 'tree-rules');
rules.setAttribute('data-fb-label', 'How prototyping should be done');
rules.innerHTML = `
	<div class="rail__title">How prototyping should be done</div>
	<ol class="rules" style="margin:.625rem 0 0;padding-left:1.125rem">
	 <li><b>Every prototype keeps the whole feature set.</b> A prototype that drops a control to make a layout
	 argument is not a prototype, it is a lie about the layout. A–D all carry drag-move, range-select, bulk edit,
	 NLP quick add, RSVP, recurrence and the offline queue.</li>
	 <li><b>Every variant is one engine plus its own chrome.</b> <code>proto-shell.js</code> renders the view;
	 the page file is only the frame around it. So a layout change is a small diff, and the variants cannot
	 drift apart by accident. The baseline is the exception — it is standalone precisely because it has to
	 reproduce the shipped page rather than a prototype of it.</li>
	 <li><b>Every prototype states the question it exists to answer</b> in its <code>#fb-page</code> block, and
	 the question is what the round-1 verdict is measured against — not taste.</li>
	 <li><b>A review produces a synthesis, not a patch.</b> The losers stay on disk as the record of the
	 argument. See <a href="calendar-ui/d-working-calendar.html" style="color:var(--terracotta)">D</a>.</li>
	 <li><b>Feedback is per prototype and never erased.</b> Notes are keyed on the path, so two sets can both
	 ship an <code>index.html</code> without merging. Rounds accumulate; a mark that flips bad→good is the
	 evidence the fix landed.</li>
	 <li><b>The chrome is one collapsed thing, not two bars.</b> A single 36px dock carries the review tool and
	 the prototype switcher; both open from it, one at a time, and the dock is the only thing you drag. See
	 <a href="calendar-ui/dock-check.mjs" style="color:var(--terracotta)">dock-check.mjs</a>, which asserts the
	 chrome really is collapsed rather than just styled smaller.</li>
	 <li><b>The tree is checked, not trusted.</b> <code>tree-check.mjs</code> fails if this page lists a file
	 that is not on disk, or if a file on disk is missing from here. A tree that lies is worse than no tree.</li>
	 <li><b>Spacing is measured, not eyeballed.</b> <code>spacing-check.mjs</code> loads every page in a real
	 browser at two viewports and reads the boxes: nothing touches, containers breathe, bands stay compact.
	 It is the floor the next pass checks against, instead of a fresh opinion.</li>
	 <li><b>Defects in the real app are shown, not smoothed over.</b> A broken <code>href</code> renders
	 broken, a parked module renders parked. The prototype is evidence.</li>
	</ol>
	<div class="cmd" style="margin-top:1rem">node prototypes/tree-check.mjs
node prototypes/serve-check.mjs
node prototypes/spacing-check.mjs
node prototypes/app-ui/app-check.mjs
foreach ($t in 'smoke','lint','nav-check','feedback-check','drag-check','dock-check','feedback-e2e','rounds-e2e') {
  node "prototypes\calendar-ui\$t.mjs"
}</div>
	<p class="hint" style="margin:.625rem 0 0;line-height:1.7">Twelve suites. Every expectation is derived from
	the repo — the directory, <code>schema.ts</code>, the nav tables in <code>navItems.ts</code> — so they fail
	when the prototypes drift rather than when someone remembers to update a list.</p>`;
body.appendChild(rules);

/* One registry, one rule: exactly the active pane is displayed. Anything
   fancier and a pane silently survives the switch. */
Object.entries(PANES).forEach(([k, p]) => { p.style.display = k === 'lineup' ? '' : 'none'; });
views.querySelector('button').classList.add('is-on');
const fromHash = (location.hash || '').slice(1);
if (PANES[fromHash]) show(fromHash);

/* ── tallies in the hero ─────────────────────────────────────────────── */
/* Runs after body is in the document — it writes into the hero.
   Two sources: the registry (durable, checked) for how many pages have been
   reviewed, and the local store (this browser) for the live mark tallies. */
function paintTallies() {
	const all = [...ALL_FILES, 'calendar-ui/index.html', 'app-ui/index.html', 'index.html'];
	let g = 0, b = 0, i = 0, local = 0;
	all.forEach((f) => { const t = tally(f); if (t) { local++; g += t.good; b += t.bad; i += t.idea; } });
	const reg = [...REVIEW.values()];
	const reviewed = reg.filter((r) => r.state === 'reviewed').length;
	const unreviewed = reg.filter((r) => r.state === 'unreviewed').length;
	const approved = reg.filter((r) => r.outcome === 'approved').length;
	const rebuild = reg.filter((r) => r.outcome === 'rebuild').length;
	document.getElementById('tallies').innerHTML = `
		<span class="pill pill-xs pill-blush">${ALL_FILES.length} prototypes</span>
		<span class="pill pill-xs ${reviewed ? 'pill-mint' : 'pill-blush'}" title="from review.json, checked against feedback/ by review-check.mjs">${reviewed} reviewed</span>
		${unreviewed ? `<span class="pill pill-xs pill-blush" title="never reviewed">${unreviewed} unreviewed</span>` : ''}
		${approved ? `<span class="pill pill-xs pill-mint" title="reviewed, approved — port it to the app">${approved} approved</span>` : ''}
		${rebuild ? `<span class="pill pill-xs pill-blush" title="reviewed, has marks flagged redo">${rebuild} to rebuild</span>` : ''}
		${g ? `<span class="pill pill-xs pill-mint">${g} good</span>` : ''}
		${b ? `<span class="pill pill-xs pill-blush">${b} to redo</span>` : ''}
		${i ? `<span class="pill pill-xs pill-blue">${i} ideas</span>` : ''}
		${REVIEW.size ? `<span class="pill pill-xs pill-token" title="review.json is the record; this browser's store is only the live tally">this browser: ${local} marked</span>` : ''}
		<a class="btn btn-soft btn-sm" href="app-ui/models.html">the data model</a>`;
}

/* ── lock-in ────────────────────────────────────────────────────────────
   Approving happens on the page (the dock menu). LOCKING IN happens here.
   A browser cannot write files, so the click goes to the collector's
   /__lock, which delegates to the project's lockin.mjs. That hook owns the
   project's vocabulary — what a ticket is called, how it is numbered — so
   nothing in the skill has to know it. The hook also reads the page's own
   record for its identity, so nothing here has to carry that either. */
const lockBar = document.createElement('div');
lockBar.className = 'lockbar';
lockBar.setAttribute('data-fb', 'tree-lockin');
lockBar.setAttribute('data-fb-label', 'Lock in an approval');
lockBar.style.cssText = 'display:none';
lockBar.innerHTML =
	'<span class="hint" style="flex:1;min-width:0"></span>' +
	'<button class="btn btn-primary btn-sm" type="button">Lock in and raise tickets</button>';
const lockInfo = lockBar.querySelector('.hint');
const lockBtn = lockBar.querySelector('button');

/** Approved pages, in registry order. */
function approvedPages() {
	return [...REVIEW.entries()].filter(([, r]) => r.approved).map(([file, r]) => ({ file, r }));
}

function refreshLockBar() {
	const pending = approvedPages();
	if (!pending.length) {
		lockBar.style.display = 'none';
		return;
	}
	lockBar.style.display = '';
	const { file, r } = pending[0];
	const more = pending.length - 1;
	lockInfo.textContent =
		`Approved: ${file}` +
		(r.tickets?.length ? ` — already raised as #${r.tickets.join(', #')}` : ' — not yet locked in') +
		(more ? ` · ${more} more approved` : '');
	lockBtn.textContent = r.tickets?.length ? 'Lock in again' : 'Lock in and raise tickets';
	lockBar.dataset.target = file;
}

lockBtn.addEventListener('click', async () => {
	const file = lockBar.dataset.target;
	if (!file) return;
	lockBtn.disabled = true;
	lockBtn.textContent = 'Locking in…';
	try {
		const res = await fetch('/__lock', {
			method: 'POST',
			headers: { 'content-type': 'application/json' },
			body: JSON.stringify({ page: file, build: { approved: true, approvedAt: REVIEW.get(file).approvedAt } })
		});
		const out = await res.json();
		lockInfo.textContent = out.message || out.error || 'no answer';
		lockBtn.textContent = out.ok ? 'Locked in' : 'Lock-in failed';
		if (out.ok) {
			if (refreshReview) await refreshReview();
			repaintReview();
			refreshLockBar();
		}
	} catch (e) {
		lockInfo.textContent = 'Lock-in failed — is the collector running? (npm run proto:serve)';
		lockBtn.textContent = 'Lock-in failed';
	} finally {
		lockBtn.disabled = false;
	}
});
document.body.appendChild(body);
body.appendChild(lockBar);
paintTallies();
/* The registry load lives in the IIFE at the top of this file: it has to await
   a module before it can paint, and doing it here as well would fire it twice
   and race the badges. */
window.addEventListener('storage', paintTallies);
document.addEventListener('proto-review:change', repaintReview);
</script>
</body>
