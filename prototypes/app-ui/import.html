<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Import — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "import", "label": "Import", "family": "app-ui",
  "question": "Is ICS import a power feature or a migration crutch? And should it guess at duplicate detection?",
  "thesis": "A preview-then-commit flow. Import without previewing is how you end up with 400 events and no idea which one is a duplicate.",
  "realPage": "src/routes/(calendar)/calendar/import/ — +page.svelte 169. Gated on subscriptionTypes.exportImportEnabled."
}
</script>
<style>
	.im { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
	@media (min-width: 950px) { .im { grid-template-columns: minmax(0,1fr) 20rem; } }
	.drop { border: 2px dashed var(--s300); border-radius: 1.25rem; padding: 2.5rem 1.5rem; text-align: center; background: rgba(255,255,255,.6); }
	.drop.is-hot { border-color: var(--terracotta); background: rgba(254,213,207,.25); }
	.drop__i { height: 3rem; width: 3rem; border-radius: 1rem; display: grid; place-items: center; margin: 0 auto .875rem; background: rgba(190,218,227,.5); color: var(--blue-ink); }
	.ics { display: flex; align-items: center; gap: .625rem; padding: .625rem 0; font-size: .875rem; }
	.ics + .ics { border-top: 1px solid var(--s100); }
	.ics__n { flex: 1; min-width: 0; font-weight: 600; color: var(--s800); }
	.ics__c { font-size: .75rem; color: var(--s400); font-variant-numeric: tabular-nums; }
	.pv { display: flex; align-items: flex-start; gap: .625rem; padding: .5rem 0; font-size: .8125rem; }
	.pv + .pv { border-top: 1px solid var(--s100); }
	.box { height: 1.125rem; width: 1.125rem; border-radius: .3125rem; border: 2px solid var(--s300); flex: none; margin-top: .125rem; cursor: pointer; display: grid; place-items: center; }
	.box.is-on { background: var(--p600); border-color: var(--p600); color: #fff; font-size: .625rem; }
	.box.is-dup { border-color: #fca5a5; background: rgba(254,202,202,.3); }
	.wk { display: flex; gap: .375rem; flex-wrap: wrap; margin-top: .5rem; }
	.wk span { display: inline-flex; align-items: center; height: 1.5rem; padding: 0 .625rem; border-radius: 9999px; font: 600 .75rem/1 inherit; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';

const FILES = [
	{ n: 'jon-hopper.ics', c: 84, dupe: 6 },
	{ n: 'kids-activities.ics', c: 212, dupe: 31 },
	{ n: 'nfl-2026.ics', c: 68, dupe: 0 }
];
const PREVIEW = [
	{ t: 'Soccer practice', w: 'Tuesdays 4:30–5:15pm · Riverside Fields', dupe: false },
	{ t: 'Art class', w: 'Tuesdays 5:30–6:30pm · Community Centre', dupe: false },
	{ t: 'Standup', w: 'Weekdays 12:15–1:00pm · Work', dupe: true },
	{ t: 'Piano — Eli', w: 'Tuesdays 5:30–6:30pm · Lesson Room 2', dupe: true },
	{ t: '1:1 with Dana', w: 'Thursdays 2:00–2:30pm', dupe: false },
	{ t: 'All-hands', w: 'Monthly · Video call', dupe: false },
	{ t: 'Book club', w: 'Second Tuesday · Library', dupe: false }
];

const im = el('div', 'im');
const main = el('div', 'vstack');
const side = el('div', 'vstack');
im.appendChild(main);
im.appendChild(side);

/* ── drop ────────────────────────────────────────────────────────────── */
const drop = el('div', 'drop');
drop.setAttribute('data-fb', 'drop-zone');
drop.setAttribute('data-fb-label', 'Drop zone');
drop.innerHTML = `
	<div class="drop__i">
	  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="height:1.5rem;width:1.5rem"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0L7 9m5-5l5 5M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
	</div>
	<div style="font-size:1.125rem;font-weight:800;color:var(--s900)">Drop .ics files here</div>
	<p class="hint" style="margin:.5rem auto 0;max-width:26rem;line-height:1.7">From Google Calendar, Apple
	Calendar, Outlook, or anything that exports iCalendar. Files are read in the browser and sent as text —
	nothing is uploaded to a third party.</p>
	<button class="btn btn-soft btn-md" style="margin-top:1.25rem" onclick="toast('File picker — prototype stub')">Choose files</button>`;
main.appendChild(drop);

/* ── files found ─────────────────────────────────────────────────────── */
main.appendChild(card(
	`${sectionTitle('What is in them', `<span class="hint">${FILES.reduce((a, f) => a + f.c, 0)} events · ${FILES.reduce((a, f) => a + f.dupe, 0)} likely duplicates</span>`)}
	 ${FILES.map((f) => `
	   <div class="ics">
	     <span class="pill pill-xs pill-token">ics</span>
	     <span class="ics__n truncate">${f.n}</span>
	     <span class="ics__c">${f.c} events</span>
	     ${f.dupe ? `<span class="pill pill-xs pill-blush">${f.dupe} dupes</span>` : '<span class="pill pill-xs pill-mint">no dupes</span>'}
	     <button class="btn-icon" style="height:1.75rem;width:1.75rem" onclick="toast('Removed')">✕</button>
	   </div>`).join('')}
	 <div class="acts rowflex gap-2" style="margin-top:.875rem">
	   <button class="btn btn-primary btn-md" onclick="toast('Previewing — nothing is saved yet')">Preview the import</button>
	   <span class="hint">Nothing is written until you confirm.</span>
	 </div>`,
	'files-found', 'What is in them'));

/* ── preview ─────────────────────────────────────────────────────────── */
const pv = el('div');
pv.setAttribute('data-fb', 'import-preview');
pv.setAttribute('data-fb-label', 'Preview before committing');
const boxes = new Set(PREVIEW.map((_, i) => i).filter((i) => !PREVIEW[i].dupe));
function paintPv() {
	pv.innerHTML = `
	<div class="rail__card">
	  ${sectionTitle('Preview', `<span class="hint">${boxes.size} of ${PREVIEW.length} selected</span>`)}
	  <p class="hint" style="line-height:1.7;margin-bottom:.5rem">Red rows already exist in this family. They are
	  unticked by default — an import that silently doubles your calendar is worse than no import.</p>
	  ${PREVIEW.map((p, i) => `
	    <div class="pv">
	      <span class="box${boxes.has(i) ? ' is-on' : ''}${p.dupe ? ' is-dup' : ''}" onclick="tog(${i})" role="checkbox" aria-checked="${boxes.has(i)}" tabindex="0">${boxes.has(i) ? '✓' : ''}</span>
	      <span style="flex:1;min-width:0">
	        <span style="display:block;font-weight:600;color:${p.dupe ? 'var(--s600)' : 'var(--s800)'}">${p.t}</span>
	        <span class="hint">${p.w}</span>
	      </span>
	      ${p.dupe ? '<span class="pill pill-xs pill-blush">already there</span>' : '<span class="pill pill-xs pill-mint">new</span>'}
	    </div>`).join('')}
	  <button class="btn btn-primary btn-md" style="width:100%;margin-top:1rem" onclick="toast(\`${boxes.size} events imported\`)">Import ${boxes.size} events</button>
	</div>`;
}
paintPv();
main.appendChild(pv);

/* ── side: where they go ─────────────────────────────────────────────── */
side.appendChild(card(
	`${sectionTitle('Where do they go')}
	 <label class="field"><span class="hint" style="display:block;margin-bottom:.375rem">Calendar</span>
	   <select class="input wide"><option>Kids</option><option>Work (Jon)</option><option>School</option><option>New calendar…</option></select></label>
	 <div class="wk" style="margin-top:.25rem">
	   <span style="background:rgba(190,218,227,.6);color:#366d7e">Recurrences kept</span>
	   <span style="background:rgba(196,233,218,.6);color:#2d5866">Alarms dropped</span>
	   <span style="background:rgba(241,181,152,.6);color:#84412e">Duplicates skipped</span>
	 </div>
	 <p class="hint" style="line-height:1.7;margin-top:.75rem">An iCalendar <code>RRULE</code> becomes one
	 <code>events</code> row with <code>recurrence_frequency</code> set — not 18 rows. That is why the family
	 calendar stays small no matter how much you import.</p>`,
	'import-target', 'Where they go'));

side.appendChild(card(
	`${sectionTitle('Plan gate')}
	 <p class="hint" style="line-height:1.7">Import is gated on
	 <code>subscriptionTypes.exportImportEnabled</code>, read on every load. On a plan without it the whole page
	 is replaced by an upsell — but the page is in the navbar regardless, so a user on a free plan finds a
	 button that leads to a paywall with no warning.</p>`,
	'plan-gate', 'Plan gate',
	'background:linear-gradient(140deg,rgba(254,213,207,.4),#fff);border-color:transparent'));

side.appendChild(card(
	`${sectionTitle('Is it a power feature?')}
	 <p class="hint" style="line-height:1.7">It is the single biggest reason families switch — everyone
	 arrives from Google Calendar. So it earns the navbar slot.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">But it is a one-time event, and it is treated as
	 a destination. The preview is the actual product; the drop zone is just the way in.</p>`,
	'feature-argument', 'Is it a power feature?'));

window.tog = (i) => { boxes.has(i) ? boxes.delete(i) : boxes.add(i); paintPv(); };
window.toast = toast;

mountApp({
	head: {
		kicker: 'Prototype · Import',
		title: 'Import from another calendar',
		lede: 'Parse, preview, then commit. The duplicate guess is un-ticked by default, because doubling a family calendar is the one outcome nobody wants.',
		actions: `<a class="btn btn-soft btn-sm" href="../calendar-ui/d-working-calendar.html">← Calendar</a>`
	},
	body: im
});
</script>
</body>
</html>
