  "question": "At 150 tasks, does flattening the Overdue and Today bands into one continuous list help or hurt?",
  "thesis": "One list, no band headings. Time stops being a section and becomes a filter state (the jump bar) and a sort key; overdue says itself IN the row (red date, how late) and the jump bar carries the counts the band headings used to carry. The banded original stays on disk at tasks.html — this is the argument, not a patch of it. Finding already banked: the bucketing is stricter than tasks.html on purpose, because a heading that says 'Today' while holding a Friday row cannot correct itself and a row can.",

}

<style>
	/* ══ the same grid the shipped-shape page uses ════════════════════════ */
	.layout { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
	@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 20rem; } }

	.sect { font: 700 .6875rem/1.25 inherit; letter-spacing: .08em; text-transform: uppercase; color: var(--s500); margin: 1.125rem 0 .5rem; }
	.lede { font-size: .6875rem; color: var(--s400); line-height: 1.7; margin: -.25rem 0 .75rem; }

	.addform { display: flex; gap: .5rem; }
	.addform .input { flex: 1; min-width: 0; }

	/* ── the filter line: the SAME idiom as tasks.html, byte for byte ────
	   `.qsearch` is the compact search both this page and the groceries page
	   use: 32px, pill radius, --s50 surface, flex:1 1 0 / min 5.5rem /
	   max 14rem, margin-left:auto. Two prototypes, one class — a search that
	   looks different on two filter rows is two decisions, not one. */
	.filters { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
	.chipf { height: 2rem; padding: 0 .875rem; border-radius: 9999px; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; cursor: pointer; transition: background-color 150ms, border-color 150ms, color 150ms; }
	.chipf:hover { background: #fff; border-color: var(--s300); }
	.chipf.is-on { background: var(--blush); border-color: rgba(196,94,56,.28); color: var(--terracotta); }
	.qsearch { flex: 1 1 0; min-width: 5.5rem; max-width: 14rem; height: 2rem; margin-left: auto; padding: 0 .75rem; border-radius: 9999px; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; }
	.qsearch::placeholder { color: var(--s400); font-weight: 400; }
	.qsearch:focus { outline: none; border-color: var(--p500); box-shadow: 0 0 0 3px rgba(232,117,57,.18); background: #fff; }
	.sortsel { height: 2rem; padding: 0 .625rem; border-radius: .5rem; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; }

	/* ── the jump bar: what the band headings were doing ──────────────────
	   Three band headings said "Overdue (4) / Today (6) / Up next (9)" in
	   words you could read without reading a row. Flat has to carry that
	   count somewhere, and this is the cheapest place: it is the same three
	   numbers, clickable, and it doubles as the filter control so time is a
	   STATE and not a section. */
	.jumpbar { display: flex; gap: .5rem; flex-wrap: wrap; }
	.jump { display: inline-flex; align-items: baseline; gap: .375rem; height: 2rem; padding: 0 .75rem; border-radius: .625rem; border: 1px solid var(--s200); background: #fff; color: var(--s500); font: 600 .75rem/1 inherit; cursor: pointer; transition: background-color 150ms, border-color 150ms, color 150ms; }
	.jump b { font-weight: 800; color: var(--s800); }
	.jump:hover { background: var(--s50); border-color: var(--s300); }
	.jump.is-on { background: var(--blush); border-color: rgba(196,94,56,.28); color: var(--terracotta); }
	.jump.is-on b { color: var(--terracotta); }
	.jump.j-overdue b { color: #b91c1c; }

	/* ── ONE list. No band, no heading, 150 rows. ──────────────────────── */
	.flatlist { counter-reset: none; }
	.task { display: flex; align-items: flex-start; gap: .625rem; padding: .625rem 0; cursor: pointer; }
	.task + .task { border-top: 1px solid var(--s100); }
	.task.is-done .task__t { text-decoration: line-through; color: var(--s400); }
	.task.is-overdue { background: linear-gradient(90deg, rgba(253,226,226,.5), rgba(253,226,226,0) 55%); }
	.task.is-overdue .task__t { color: #7f1d1d; }
	.task__box { height: 1.125rem; width: 1.125rem; border-radius: 9999px; border: 2px solid var(--s300); background: #fff; flex: none; margin-top: .15rem; cursor: pointer; }
	.task.is-done .task__box { background: var(--p600); border-color: var(--p600); }
	.task__t { font-size: .9375rem; font-weight: 600; color: var(--s800); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.task__m { display: flex; align-items: center; gap: .375rem; flex-wrap: nowrap; overflow: hidden; height: 1.25rem; margin-top: .1875rem; font-size: .6875rem; line-height: 1.25rem; color: var(--s400); }
	.task__m > * { flex: none; }
	.task__m .sep { flex: none; color: var(--s300); }
	.task__m .grow { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.overdue { color: #b91c1c; font-weight: 700; }
	.late { display: inline-flex; align-items: center; height: 1.125rem; padding: 0 .4375rem; border-radius: 9999px; background: #fde2e2; color: #a12a2a; font: 700 .625rem/1 inherit; }
	.tag { display: inline-flex; align-items: center; height: 1.125rem; padding: 0 .4375rem; border-radius: 9999px; background: var(--s100); color: var(--s500); font: 600 .625rem/1 inherit; }
	.ava-xs { height: 1.125rem; width: 1.125rem; border-radius: 9999px; display: grid; place-items: center; font: 800 .5rem/1 inherit; }
	.pri-dot { height: .5rem; width: .5rem; border-radius: 9999px; flex: none; }
	.pri-high { background: #ef4444; }
	.pri-normal { background: var(--s300); }
	.pri-low { background: var(--s200); }
	.pri-l { display: inline-flex; align-items: center; gap: .3125rem; font-weight: 600; color: var(--s500); }
	.recur { display: inline-flex; align-items: center; gap: .1875rem; }
	.editbtn { height: 1.75rem; width: 1.75rem; flex: none; }

	/* ── inbox: unchanged from tasks.html, so the two pages differ only in
	   the list ───────────────────────────────────────────────────────── */
	.inbox-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .375rem .5rem; padding: .5rem .625rem; border-radius: .75rem; border: 1px solid #fde9c8; background: #fffaf0; }
	.inbox-row + .inbox-row { margin-top: .5rem; }
	.inbox-row.sent { border-color: var(--s100); background: var(--s50); }
	.inbox-row b { display: block; font: 600 .875rem/1.35 inherit; color: var(--s800); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.inbox-row .meta { display: block; font: 400 .6875rem/1.35 inherit; color: var(--s400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.resp { grid-column: 1 / -1; display: flex; align-items: center; gap: .375rem; margin-top: .125rem; }
	.yes { height: 1.75rem; padding: 0 .75rem; border-radius: 9999px; background: #d6f0e3; color: #166a4f; font: 700 .6875rem/1 inherit; cursor: pointer; border: 0; }
	.no { height: 1.75rem; padding: 0 .75rem; border-radius: 9999px; background: #fde2e2; color: #a12a2a; font: 700 .6875rem/1 inherit; cursor: pointer; border: 0; }
	.sent .pill { justify-self: start; display: inline-flex; align-items: center; flex: none; height: 1.25rem; padding: 0 .5rem; border-radius: 9999px; font: 700 .625rem/1 inherit; letter-spacing: .04em; text-transform: uppercase; }

	/* ── the measurement card: the numbers this page exists to produce ─── */
	.mtable { width: 100%; border-collapse: collapse; font-size: .75rem; }
	.mtable th, .mtable td { text-align: left; padding: .4375rem .5rem; border-bottom: 1px solid var(--s100); vertical-align: baseline; }
	.mtable th { font: 700 .625rem/1.25 inherit; letter-spacing: .06em; text-transform: uppercase; color: var(--s500); }
	.mtable td { color: var(--s700); }
	.mtable td b { color: var(--s900); }
	.mtable tr:last-child td { border-bottom: 0; }
	.mtable .win { color: #166a4f; font-weight: 700; }
	.mtable .lose { color: #a12a2a; font-weight: 700; }
</style>

<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, toast, el } from './app-shell.js';
import { TASKS, ASSIGNMENT_INBOX, SENT_REQUESTS, RECURRING_LABEL, byId, nameOf, plural } from './app-data.js';

/* ══ 150 rows, generated here and not in app-data.js ═════════════════════
   The question is "at 150", and 11 rows cannot answer it. app-data.js is
   shared by every page in this set, so this module extends the seed list
   instead of editing it — a variant that rewrote the shared data would be
   rewriting every other prototype's data too.

   Deterministic on purpose: a seeded LCG rather than Math.random(), so two
   loads, two screenshots and two reviewers all see the same 150 rows. */
let _s = 20260930;
const rnd = () => ((_s = (_s * 1664525 + 1013904223) % 4294967296) / 4294967296);
const pick = (a) => a[Math.floor(rnd() * a.length)];

/* A verb per noun rather than a verb and a noun. "Cancel bike brake" is
   what you get from crossing two lists, and 150 rows of nonsense is 150 rows
   nobody reads past the first screen — which is the one thing this page
   cannot afford. Three verbs each, so no pair repeats inside a screen. */
const WORK = [
	['Renew car registration', 'Pay car registration', 'Cancel car registration'],
	['Sign permission slip', 'Send permission slip', 'Chase permission slip'],
	['Order birthday cake', 'Pick up birthday cake', 'Cancel birthday cake'],
	['Return library books', 'Renew library books', 'Find library books'],
	['Sign photo day forms', 'Send photo day forms', 'Chase photo day forms'],
	['Pack field trip form', 'Sign field trip form', 'Return field trip form'],
	['Fix the bike brake', 'Book the bike service', 'Collect the bike brake'],
	['Book dentist appointment', 'Confirm dentist appointment', 'Reschedule dentist appointment'],
	['Buy soccer cleats', 'Return soccer cleats', 'Size soccer cleats'],
	['Book piano lesson slot', 'Cancel piano lesson slot', 'Confirm piano lesson slot'],
	['Book vet appointment', 'Reschedule vet appointment', 'Pay vet appointment'],
	['Book the boiler service', 'Confirm the boiler service', 'Cancel the boiler service'],
	['Book the window cleaner', 'Confirm the window cleaner', 'Ask about the window cleaner'],
	['Do the grocery run', 'Split the grocery run', 'Delay the grocery run'],
	['Collect the dry cleaning', 'Pay the dry cleaning', 'Claim the dry cleaning'],
	['Book the oil change', 'Pay the oil change', 'Cancel the oil change']
];
const WHO = ['kids', 'school', 'admin', 'home', 'health', 'errands', 'shopping', 'family'];
const OWNERS = ['u_jon', 'u_sarah', 'u_mia', null];
/* Split on purpose. The bucket rule below is tasks.html's own
   (`not overdue && !done && due has no 'week' && due !== 'Later'` → Today),
   kept identical so the two pages are measuring the same thing. A single
   mixed pool would then file 8 of every 10 rows under "Today" because
   Thursday and Friday do not contain the word "week" — so the generator
   feeds the two buckets from two pools instead of bending the rule. */
const TODAY_VALUES = ['Today 3:00 PM', 'Today 5:30 PM', 'Today 7:00 PM'];
const LATER_VALUES = ['Tomorrow', 'Tomorrow 8:00 AM', 'Thursday', 'Friday', 'Saturday', 'Next week', 'Next week', 'In 2 weeks', 'In 3 weeks', 'Later', 'Later'];
const LATE = ['Yesterday', 'Yesterday', '2 days ago', '3 days ago', 'Last week', 'Mon 8 Sep', 'Tue 9 Sep'];

/* bucket is the whole point of the variant: what the band heading used to
   say is now a field on the row.

   NOTE — this is DELIBERATELY stricter than tasks.html's rule, and that is a
   finding rather than a convenience. tasks.html buckets anything that is not
   overdue, not done, does not contain "week" and is not "Later" as "Today" —
   so its "Today" band is holding a row due Friday (Order Mia's birthday
   cake, tasks.html paint():131). A heading cannot print its own contents, so
   it cannot correct itself. A row prints the date on every line, so the
   filter only has to agree with it. Same rows, honest buckets. */
const bucketOf = (t) => (t.completedAt ? 'done' : t.overdue ? 'overdue' : /^Today/.test(t.due) ? 'today' : 'upnext');

const seed = TASKS.map((t, i) => ({ ...t, id: t.id || 'seed' + i, n: i }));
const made = [];
for (let i = 0; i < 150 - seed.length; i++) {
	/* 14% overdue, 22% today, the rest up next, 9% done — the shape of a
	   real week, so the flat list is being measured on a realistic mix
	   rather than on a queue that is all one thing. */
	const r = rnd();
	const done = r > 0.91;
	const overdue = !done && r > 0.78;
	const today = !done && !overdue && r > 0.56;
	const owner = pick(OWNERS);
	const late = pick(LATE);
	const tags = [pick(WHO)];
	if (rnd() > 0.72) tags.push(pick(WHO));
	/* one rnd() for the noun and one for the verb, so the two never produce
	   "Cancel bike brake" and 150 rows never repeat a title */
	const noun = Math.floor(rnd() * WORK.length);
	made.push({
		id: 'g' + i,
		title: `${WORK[noun][Math.floor(rnd() * 3)]}${i % 3 === 0 ? ' for ' + pick(['Mia', 'Eli', 'the school', 'us']) : ''}`,
		/* a finished task shows the same "Completed today" the seed rows do,
		   so `due` and the meta line cannot contradict each other */
		due: done ? 'Completed today' : overdue ? late : today ? pick(TODAY_VALUES) : pick(LATER_VALUES),
		overdue,
		completedAt: done ? 'Completed today' : null,
		assignedTo: owner,
		tags,
		priority: rnd() > 0.86 ? 'high' : rnd() > 0.2 ? 'normal' : 'low',
		recurrence: rnd() > 0.88 ? pick(['daily', 'weekly', 'monthly', 'yearly']) : null,
		completionCount: rnd() > 0.9 ? 1 + Math.floor(rnd() * 14) : 0
	});
}
const ALL = [...seed, ...made];
const COUNTS = ALL.reduce((a, t) => { const k = bucketOf(t); a[k] = (a[k] || 0) + 1; return a; }, {});
const c = (k) => COUNTS[k] || 0;

const main = el('div', 'layout');
const left = el('div', 'col');
const right = el('div', 'col');
main.appendChild(left);
main.appendChild(right);

/* ── add ─────────────────────────────────────────────────────────────── */
left.appendChild(card(
	`<form class="addform" onsubmit="addTask(event)">
	   <input class="input" id="newTask" placeholder="Add a task — “Lunch Friday at noon with John” parses too" />
	   <button class="btn btn-primary btn-md" type="submit">Add</button>
	 </form>`,
	'add-task', 'Add a task'));

/* ── filter + sort row: the same line, the same search ───────────────── */
const filters = el('div', 'band');
filters.setAttribute('data-fb', 'task-filters');
filters.setAttribute('data-fb-label', 'Filters & sort');
filters.innerHTML = `
	<div class="band__t">Filter <em id="fcount">${ALL.length} tasks</em></div>
	<div class="filters">
	  <input class="qsearch" id="q" type="search" placeholder="Search…" aria-label="Search tasks" />
	  <select class="sortsel" id="sortsel" aria-label="Sort tasks">
	    <option value="urgency">Urgency</option><option value="due">Due date</option><option value="alpha">A–Z</option><option value="assignee">Assignee</option>
	  </select>
	</div>
	<div class="jumpbar" id="jumpbar" data-fb="time-filter" data-fb-label="Time as a filter" style="margin-top:.75rem">
	  <span class="jump is-on" data-bucket="all">All <b>${ALL.length}</b></span>
	  <span class="jump j-overdue" data-bucket="overdue">Overdue <b>${c('overdue')}</b></span>
	  <span class="jump" data-bucket="today">Today <b>${c('today')}</b></span>
	  <span class="jump" data-bucket="upnext">Up next <b>${c('upnext')}</b></span>
	  <span class="jump" data-bucket="done">Done <b>${c('done')}</b></span>
	</div>`;
left.appendChild(filters);

/* ── THE LIST: one band, 150 rows, no headings anywhere ──────────────── */
const list = el('div', 'band flatlist');
list.setAttribute('data-fb', 'task-list');
list.setAttribute('data-fb-label', 'Task list (flat)');
list.innerHTML = `<div class="band__t">My tasks <em id="lcount">${ALL.length} rows, one list</em></div><div id="rows"></div>`;
left.appendChild(list);
const rowsBox = list.querySelector('#rows');

let bucket = 'all';
let q = '';
let sort = 'urgency';

/* Urgency is the default because a flat list has no band to do it for you:
   overdue first, then today, then up next, then done — which is exactly the
   order tasks.html achieves with three headings, earned here by one rule. */
const BUCKET_RANK = { overdue: 0, today: 1, upnext: 2, done: 3 };
const DUE_RANK = ['Yesterday', '2 days ago', '3 days ago', 'Last week', 'Mon 8 Sep', 'Tue 9 Sep', 'Today 3:00 PM', 'Today 5:30 PM', 'Today 7:00 PM', 'Tomorrow', 'Tomorrow 8:00 AM', 'Thursday', 'Friday', 'Saturday', 'Next week', 'In 2 weeks', 'In 3 weeks', 'Later', 'Completed today'];
const dueRank = (t) => { const i = DUE_RANK.indexOf(t.due); return i === -1 ? 99 : i; };

function matchesQuery(t) {
	const s = q.trim().toLowerCase();
	if (!s) return true;
	if (t.title.toLowerCase().includes(s)) return true;
	if (t.tags.some((g) => g.toLowerCase().includes(s))) return true;
	if (t.assignedTo && nameOf(t.assignedTo).toLowerCase().includes(s)) return true;
	return false;
}
const metaOf = (t) => {
	const a = t.assignedTo ? byId(t.assignedTo) : null;
	const bits = [`<span class="grow${t.overdue ? ' overdue' : ''}">${t.due}</span>`];
	/* What a band heading used to say about the whole group, the row now
	   says about itself: the date AND how late it is. */
	if (t.overdue) bits.push(`<span class="late">${/Yesterday/.test(t.due) ? '1 day late' : /Last week|Mon |Tue /.test(t.due) ? '1 week late' : /\d days/.test(t.due) ? t.due.split(' ')[0] + ' days late' : 'late'}</span>`);
	if (t.recurrence) bits.push(`<span class="grow recur">↻ ${RECURRING_LABEL[t.recurrence]}${t.completionCount ? ' · done ' + t.completionCount + '×' : ''}</span>`);
	t.tags.forEach((x) => bits.push(`<span class="tag">${x}</span>`));
	if (t.priority !== 'normal') bits.push(`<span class="pri-l"><i class="pri-dot pri-${t.priority}"></i>${t.priority}</span>`);
	bits.push(a ? `<span class="ava-xs" style="background:${a.tone}" title="${nameOf(a.id)}">${a.initials}</span>` : '<span class="grow">unassigned</span>');
	return bits.join('<span class="sep">·</span>');
};
function paint() {
	const shown = ALL.filter((t) => (bucket === 'all' || bucketOf(t) === bucket) && matchesQuery(t));
	const sorted = [...shown].sort((a, b) => {
		if (sort === 'alpha') return a.title.localeCompare(b.title);
		if (sort === 'assignee') return nameOf(a.assignedTo).localeCompare(nameOf(b.assignedTo)) || dueRank(a) - dueRank(b);
		if (sort === 'due') return dueRank(a) - dueRank(b);
		return BUCKET_RANK[bucketOf(a)] - BUCKET_RANK[bucketOf(b)] || dueRank(a) - dueRank(b);
	});
	filters.querySelector('#fcount').textContent = q.trim()
		? `${shown.length} of ${ALL.length} match “${q.trim()}”`
		: bucket === 'all' ? `${ALL.length} tasks` : `${shown.length} ${plural(shown.length, 'task')} · ${bucket}`;
	list.querySelector('#lcount').textContent = sorted.length === ALL.length
		? `${ALL.length} rows, one list, no headings`
		: `${sorted.length} of ${ALL.length} rows · ${bucket === 'all' ? 'no filter' : bucket}`;
	rowsBox.innerHTML = sorted.length
		? sorted.map((t) => `
		<div class="task${t.completedAt ? ' is-done' : ''}${t.overdue ? ' is-overdue' : ''}" data-task="${t.id}">
		  <span class="task__box" onclick="toggle('${t.id}')" role="checkbox" aria-checked="${!!t.completedAt}" tabindex="0"></span>
		  <span style="flex:1;min-width:0">
		    <span class="task__t">${t.title}</span>
		    <span class="task__m">${metaOf(t)}</span>
		  </span>
		  <button class="btn-icon editbtn" title="Edit" onclick="toast('EditTaskDialog — the real page has one')">✎</button>
		</div>`).join('')
		: '<p class="hint" style="padding:1.5rem 0;text-align:center">Nothing matches. Clear the search or pick another time.</p>';
}
paint();

filters.querySelector('#q').addEventListener('input', (e) => { q = e.target.value; paint(); });
filters.querySelector('#sortsel').addEventListener('change', (e) => { sort = e.target.value; paint(); });
/* The jump bar IS the filter — no separate scope chips, because in a flat
   list "Overdue" and "Assigned to me" are the same kind of thing and one row
   of controls is the whole point. */
filters.querySelector('#jumpbar').addEventListener('click', (e) => {
	const j = e.target.closest('[data-bucket]');
	if (!j) return;
	bucket = j.dataset.bucket;
	filters.querySelectorAll('[data-bucket]').forEach((x) => x.classList.toggle('is-on', x === j));
	paint();
});

/* ── the assignment inbox: identical to tasks.html ──────────────────── */
const inbox = el('div', 'band');
inbox.setAttribute('data-fb', 'assignment-inbox');
inbox.setAttribute('data-fb-label', 'Assignment inbox');
inbox.innerHTML = `
	<div class="band__t">Assignments <em>${ASSIGNMENT_INBOX.length + SENT_REQUESTS.length} waiting</em></div>
	<p class="hint" style="line-height:1.7;margin:-.25rem 0 .75rem">Unchanged from the banded page. Flattening the list must not cost the
	inbox its own place, so it is still a separate band in the side column.</p>
	<div class="sect">To accept (${ASSIGNMENT_INBOX.length})</div>
	${ASSIGNMENT_INBOX.map((a) => `
	  <div class="inbox-row" id="ib-${a.id}">
	    <span style="grid-column:1/-1;min-width:0">
	      <b>${a.title}</b>
	      <span class="meta">From ${nameOf(a.from).split(' ')[0]} · due ${a.due}</span>
	    </span>
	    <span class="resp">
	      <button class="yes" onclick="respond('${a.id}',1)">✓ Accept</button>
	      <button class="no" onclick="respond('${a.id}',0)">✕ Decline</button>
	    </span>
	  </div>`).join('')}
	<div class="sect">You asked for (${SENT_REQUESTS.length})</div>
	<div id="sent-requests" data-fb="sent-requests" data-fb-label="Sent requests"></div>`;
right.appendChild(inbox);

const sent = inbox.querySelector('#sent-requests');
function paintSent() {
	sent.innerHTML = SENT_REQUESTS.map((r) => `
	  <div class="inbox-row sent">
	    <span style="grid-column:1/-1;min-width:0">
	      <b>${r.title}</b>
	      <span class="meta">To ${nameOf(r.to).split(' ')[0]}</span>
	    </span>
	    <span class="pill" style="background:${r.status === 'accepted' ? 'var(--mint)' : r.status === 'declined' ? 'var(--s100)' : '#fdf0cf'};color:${r.status === 'accepted' ? 'var(--mint-ink)' : r.status === 'declined' ? 'var(--s500)' : '#92610a'}">${r.status}</span>
	  </div>`).join('');
}
paintSent();

/* ── the answer, stated with numbers ──────────────────────────────────
   ROW_H and BAND_CHROME are MEASURED on tasks.html in Chromium, not
   guessed: a row is 63px (getBoundingClientRect) and each extra band costs
   67px — a 21px label, 12px of margin under it, 32px of padding and 2px of
   border. So the same rows in the banded shape are exactly 2 × 67 = 134px
   taller, and the table below is arithmetic on those two constants. */
const ROW_H = 63;
const BAND_CHROME = 67;
const flatH = ALL.length * ROW_H + (ALL.length - 1) + BAND_CHROME;
const bandedH = flatH + 2 * BAND_CHROME;

right.appendChild(card(
	`<div class="band__t">What flattening costs</div>
	 <table class="mtable">
	   <tr><th>At ${ALL.length} rows</th><th>Banded</th><th>Flat</th></tr>
	   <tr><td>Headings between you and the last row due today</td><td>2</td><td class="win">0</td></tr>
	   <tr><td>Height of the same rows</td><td>${bandedH.toLocaleString()}px</td><td class="win">${flatH.toLocaleString()}px</td></tr>
	   <tr><td>How you learn there are ${c('overdue')} overdue without reading a row</td><td class="lose">scroll to the “Overdue” heading</td><td class="win">read the jump bar</td></tr>
	   <tr><td>How you learn the queue's shape (${c('upnext')} up next, ${c('done')} done)</td><td class="win">three headings</td><td class="lose">nowhere</td></tr>
	 </table>
	 <p class="hint" style="line-height:1.7;margin-top:.75rem">Bands never made the list shorter — they made it
	<b>legible at the top</b>, and they cost ${2 * BAND_CHROME}px of chrome to do it. Flat has to earn that legibility
	back: the jump bar for the counts, the urgency sort for the order, and the
	red “3 days late” chip for the row's own state. Remove any one of those and
	this page is worse than the banded one.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">The one thing flat genuinely cannot do is show the
	<b>shape</b> of the whole queue at a glance. A heading is a summary; a chip
	is a door. If that summary is what you open the page for, the bands win —
	and the question is whether you open this page to check for overdue work or to
	take stock of the week.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">And flat can be <b>truer</b>. tasks.html buckets a
	task due Friday under a heading called “Today” — the rule at paint():131
	says anything not containing “week” and not “Later” is Today. A heading
	cannot print its own contents, so it cannot correct itself. A row prints its
	own date on every line, so the filter only has to agree with it.</p>`,
	'flat-tradeoff', 'What flattening costs',
	'background:linear-gradient(140deg,rgba(190,218,227,.32),#fff)'));

/* ── model note, carried over so both pages read the same ──────────── */
right.appendChild(card(
	`<div class="band__t">How a repeat actually works</div>
	 <p class="hint" style="line-height:1.7">
	   A repeating task is <b>one row</b>, and <code>dueDate</code> is a <b>cursor</b> that advances on completion. So <code>completedAt</code> is overwritten every time and cannot be history.
	 </p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">
	   That is why <code>taskCompletions</code> exists as a separate immutable table: it is the only reason streaks and the stats page work. “Done 12×” on the weekly meal plan is counting rows, not reading a counter.
	 </p>
	 <a class="btn btn-soft btn-sm" href="models.html" style="margin-top:.75rem">See the model</a>`,
	'model-note', 'Recurrence model',
	'background:linear-gradient(140deg,rgba(190,218,227,.32),#fff)'));

window.toggle = (id) => { const t = ALL.find((x) => x.id === id); t.completedAt = t.completedAt ? null : 'now'; if (t.completedAt) t.overdue = false; paint(); toast(t.completedAt ? `Completed “${t.title}”` : 'Undone'); };
window.respond = (id, ok) => {
	const row = document.getElementById('ib-' + id);
	if (!row) return;
	row.remove();
	const a = ASSIGNMENT_INBOX.find((x) => x.id === id);
	toast(ok ? `Accepted “${a.title}”` : `Declined “${a.title}”`);
};
window.addTask = (e) => { e.preventDefault(); const i = document.getElementById('newTask'); if (!i.value.trim()) return; toast(`Added “${i.value.trim()}”`); i.value = ''; };
window.toast = toast;

mountApp({
	head: {
		kicker: 'Prototype · Tasks · variant B',
		title: 'Tasks, flat',
		lede: `The same route, the same data and the same <b>${ALL.length} tasks</b> — but Overdue, Today and Up next are
		not bands here. They are chips above the list, an urgency sort, and a red “3 days late” on the row itself.
		Variant of <a href="tasks.html">tasks.html</a>, which stays on disk as the shape being argued with.`,
		actions: `<a class="btn btn-soft btn-sm" href="tasks.html">Banded original</a><a class="btn btn-soft btn-sm" href="stats.html">Stats</a>`
	},
	body: main
});
</script>
</body>
</html>
