<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tasks — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "tasks", "label": "Tasks", "family": "app-ui",
  "question": "Can a 20–150 item list stay scannable, and is the assignment inbox clearly separate from it?",
  "thesis": "My tasks, then the assignment inbox as a distinct band. Marketing skin, same three data sources.",
  "realPage": "src/routes/(calendar)/calendar/tasks/ — +page.svelte 471, 5 components. NOTE: the real page has no internal links at all; everything is an API call. TASK SEARCH ALREADY EXISTS in the app — `TaskToolbar.svelte` binds `searchQuery` and `matchesSearch` (+page.svelte:186) matches title, notes, tags and assignee. It is not missing; it is just on its OWN full-width row BELOW the chips (44px tall, magnifier left, clear ✕ right) plus a second row for the #tag filter. The review asked for a small search on the chip line instead, which is what is shown here: same matcher, 32px tall, measuring 224px at 1280 / 94px at 375 / 115px at 320, and sharing the line with the sort select without adding a single row of height at any of them."
}
</script>
<style>
	/* minmax(0,1fr) at every width, not just the two-column one: a bare 1fr
	   track lets a grid item keep its min-content width, and the add-task row
	   pushed the whole column 36px past a 375px viewport. */
	.layout { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
	@media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr) 20rem; } }
	.col { display: flex; flex-direction: column; gap: 1.25rem; }
	.band { background: #fff; border: 1px solid var(--s200); border-radius: 1.25rem; padding: 1rem; }
	.band__t { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; font: 700 .6875rem/1.25 inherit; letter-spacing: .08em; text-transform: uppercase; color: var(--s500); }
	.band__t em { font: 600 .6875rem/1.25 inherit; font-style: normal; letter-spacing: 0; text-transform: none; color: var(--s400); }
	.sect { font: 700 .6875rem/1.25 inherit; letter-spacing: .08em; text-transform: uppercase; color: var(--s500); margin: 1.125rem 0 .5rem; }

	.addform { display: flex; gap: .5rem; }
	.addform .input { flex: 1; min-width: 0; }

	/* ── filters: a soft surface, not four hard pills on bare canvas ────── */
	.filters { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
	.chipf { height: 2rem; padding: 0 .875rem; border-radius: 9999px; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; cursor: pointer; transition: background-color 150ms, border-color 150ms, color 150ms; }
	.chipf:hover { background: #fff; border-color: var(--s300); }
	.chipf.is-on { background: var(--blush); border-color: rgba(196,94,56,.28); color: var(--terracotta); }
	.sortsel { height: 2rem; padding: 0 .625rem; border-radius: .5rem; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; }

	/* ── a small search ON the filter line ───────────────────────────────
	   Measured before: the row is 858px at 1280 and the four chips are 342.4
	   of it, which leaves 368px of dead space between the last chip and the
	   sort select (the select has always been pushed right by
	   `margin-left:auto`). The search takes that gap — it is the one control
	   here that is a filter AND a way-finding aid, so it earns the leftover
	   width instead of a row of its own.

	   `flex: 1 1 0` is load-bearing and the basis has to be ZERO. Line breaking
	   uses the item's hypothetical main size, not its shrunk size, so a 14rem
	   basis put the field on a line of its own at 375 and 320 (measured: 4
	   lines, up from 2 and 3). With a zero basis the row packs first and the
	   field grows into whatever is left: 224px at 1280 (max-width, sitting in
	   the 368px gap), 94px at 375 on the line the sort used to sit on with
	   102px of dead space, 115px at 320 on the sort's line with 123px of dead
	   space. Line count is unchanged at all three.

	   min-width 5.5rem = 88px is the number that buys that: at 6rem the 375
	   layout is 2px too wide for the field to share the sort's line and the
	   row goes to 3 lines (+40px). At 88px it fits, and 88 − 24 padding = 64px
	   of text, which is why the placeholder is "Search…" (55.6px measured) and
	   not the app's "Search tasks…" (90.4px, which clips in a 94px field).
	   aria-label keeps the full name for anyone not reading the pixels. */
	.qsearch { flex: 1 1 0; min-width: 5.5rem; max-width: 14rem; height: 2rem; margin-left: auto; padding: 0 .75rem; border-radius: 9999px; border: 1px solid var(--s200); background: var(--s50); color: var(--s500); font: 600 .8125rem/1 inherit; }
	.qsearch::placeholder { color: var(--s400); font-weight: 400; }
	.qsearch:focus { outline: none; border-color: var(--p500); box-shadow: 0 0 0 3px rgba(232,117,57,.18); background: #fff; }

	/* ── the list ───────────────────────────────────────────────────────── */
	.task { display: flex; align-items: flex-start; gap: .625rem; padding: .625rem 0; cursor: pointer; }
	.task + .task { border-top: 1px solid var(--s100); }
	.task.is-done .task__t { text-decoration: line-through; color: var(--s400); }
	.task__box { height: 1.125rem; width: 1.125rem; border-radius: 9999px; border: 2px solid var(--s300); background: #fff; flex: none; margin-top: .15rem; cursor: pointer; }
	.task.is-done .task__box { background: var(--p600); border-color: var(--p600); }
	.task__t { font-size: .9375rem; font-weight: 600; color: var(--s800); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* ONE baseline, ONE separator, ONE height. The old meta line wrapped to
	   two and three lines depending on the title, which is what made the rows
	   look ununiform. It never wraps now: the row truncates, the title does. */
	.task__m { display: flex; align-items: center; gap: .375rem; flex-wrap: nowrap; overflow: hidden; height: 1.25rem; margin-top: .1875rem; font-size: .6875rem; line-height: 1.25rem; color: var(--s400); }
	.task__m > * { flex: none; }
	.task__m .sep { flex: none; color: var(--s300); }
	.task__m .grow { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.overdue { color: #b91c1c; font-weight: 700; }
	.tag { display: inline-flex; align-items: center; height: 1.125rem; padding: 0 .4375rem; border-radius: 9999px; background: var(--s100); color: var(--s500); font: 600 .625rem/1 inherit; }
	.ava-xs { height: 1.125rem; width: 1.125rem; border-radius: 9999px; display: grid; place-items: center; font: 800 .5rem/1 inherit; }
	.pri-dot { height: .5rem; width: .5rem; border-radius: 9999px; flex: none; }
	.pri-high { background: #ef4444; }
	.pri-normal { background: var(--s300); }
	.pri-low { background: var(--s200); }
	.pri-l { display: inline-flex; align-items: center; gap: .3125rem; font-weight: 600; color: var(--s500); }

	/* ── the assignment inbox: its own band, rows with their own frame ──── */
	.inbox-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .375rem .5rem; padding: .5rem .625rem; border-radius: .75rem; border: 1px solid #fde9c8; background: #fffaf0; }
	.inbox-row + .inbox-row { margin-top: .5rem; }
	.inbox-row.sent { border-color: var(--s100); background: var(--s50); }
	.inbox-row b { display: block; font: 600 .875rem/1.35 inherit; color: var(--s800); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.inbox-row .meta { display: block; font: 400 .6875rem/1.35 inherit; color: var(--s400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* the two answers get their own line rather than a column of buttons
	   squeezing the title: the affordance is the point of this band */
	.resp { grid-column: 1 / -1; display: flex; align-items: center; gap: .375rem; margin-top: .125rem; }
	.yes { height: 1.75rem; padding: 0 .75rem; border-radius: 9999px; background: #d6f0e3; color: #166a4f; font: 700 .6875rem/1 inherit; cursor: pointer; border: 0; }
	.no { height: 1.75rem; padding: 0 .75rem; border-radius: 9999px; background: #fde2e2; color: #a12a2a; font: 700 .6875rem/1 inherit; cursor: pointer; border: 0; }
	.sent .pill { justify-self: start; display: inline-flex; align-items: center; flex: none; height: 1.25rem; padding: 0 .5rem; border-radius: 9999px; font: 700 .625rem/1 inherit; letter-spacing: .04em; text-transform: uppercase; }
	.recur { display: inline-flex; align-items: center; gap: .1875rem; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';
import { TASKS, ASSIGNMENT_INBOX, SENT_REQUESTS, RECURRING_LABEL, byId, nameOf, plural } from './app-data.js';

const main = el('div', 'layout');
const left = el('div', 'col');
const right = el('div', 'col');
main.appendChild(left);
main.appendChild(right);

/* ── add ─────────────────────────────────────────────────────────────── */
left.appendChild(card(
	`<form class="addform" onsubmit="addTask(event)">
	   <input class="input" id="newTask" placeholder="Add a task — “Lunch Friday at noon with John” parses too" />
	   <button class="btn btn-primary btn-md" type="submit">Add</button>
	 </form>`,
	'add-task', 'Add a task'));

/* ── filter + sort row ───────────────────────────────────────────────── */
const filters = el('div', 'band');
filters.setAttribute('data-fb', 'task-filters');
filters.setAttribute('data-fb-label', 'Filters & sort');
filters.innerHTML = `
	<div class="band__t">Filter <em id="fcount">${TASKS.length} tasks</em></div>
	<div class="filters">
	  <span class="chipf is-on" data-chip="open">Open</span>
	  <span class="chipf" data-chip="mine">Mine</span>
	  <span class="chipf" data-chip="assigned">Assigned to me</span>
	  <span class="chipf" data-chip="done">Done</span>
	  <input class="qsearch" id="q" type="search" placeholder="Search…" aria-label="Search tasks" />
	  <select class="sortsel" aria-label="Sort tasks">
	    <option>Due date</option><option>Priority</option><option>Alphabetical</option>
	  </select>
	</div>`;
left.appendChild(filters);

/* ── the list ────────────────────────────────────────────────────────── */
const list = el('div');
list.setAttribute('data-fb', 'task-list');
list.setAttribute('data-fb-label', 'Task list');
left.appendChild(list);

let chip = 'open';
let q = '';
/* The app's matchesSearch (+page.svelte:186) checks title, notes, tags and
   assignee. The mock has no `notes` field, so this checks the other three —
   same shape, three of four fields. */
function matchesQuery(t) {
	const s = q.trim().toLowerCase();
	if (!s) return true;
	if (t.title.toLowerCase().includes(s)) return true;
	if (t.tags.some((g) => g.toLowerCase().includes(s))) return true;
	if (t.assignedTo && nameOf(t.assignedTo).toLowerCase().includes(s)) return true;
	return false;
}
function paint() {
	const rows = TASKS.filter((t) => {
		if (chip === 'open') return !t.completedAt;
		if (chip === 'done') return !!t.completedAt;
		if (chip === 'mine') return !t.completedAt && t.assignedTo === 'u_jon';
		return !t.completedAt && t.assignedTo !== 'u_jon';
	}).filter(matchesQuery);
	const active = q.trim().length > 0;
	filters.querySelector('#fcount').textContent =
		active ? `${rows.length} of ${TASKS.length} match “${q.trim()}”` : `${TASKS.length} tasks`;
	const grouped = rows.reduce((a, t) => {
		const k = t.completedAt ? 'Done' : t.overdue ? 'Overdue' : t.due.includes('week') || t.due === 'Later' ? 'Up next' : 'Today';
		(a[k] = a[k] || []).push(t);
		return a;
	}, {});
	const order = ['Overdue', 'Today', 'Up next', 'Done'];
	/* One row, one meta line, one set of separators. The meta slots are joined
	   with `·` and the line is nowrap + overflow hidden, so a row is the same
	   shape whether it has one tag or four, and at 320px the LINE truncates
	   instead of wrapping to a second row. */
	const metaOf = (t, a) => {
		const bits = [`<span class="grow${t.overdue ? ' overdue' : ''}">${t.due}</span>`];
		if (t.recurrence) bits.push(`<span class="grow recur">↻ ${RECURRING_LABEL[t.recurrence]}${t.completionCount ? ' · done ' + t.completionCount + '×' : ''}</span>`);
		t.tags.forEach((x) => bits.push(`<span class="tag">${x}</span>`));
		// the real TaskRow only names a priority that is not normal; dot + label
		// travel as ONE slot so the dot cannot read as a stray separator
		if (t.priority !== 'normal') bits.push(`<span class="pri-l"><i class="pri-dot pri-${t.priority}"></i>${t.priority}</span>`);
		bits.push(a ? `<span class="ava-xs" style="background:${a.tone}" title="${nameOf(a.id)}">${a.initials}</span>` : '<span class="grow">unassigned</span>');
		return bits.join('<span class="sep">·</span>');
	};
	list.innerHTML = order.filter((k) => grouped[k]).map((k) => `
		<div class="band" style="margin-bottom:1rem">
		  <div class="band__t">${k} <em>${plural(grouped[k].length, 'task')}</em></div>
		  ${grouped[k].map((t) => {
			const a = t.assignedTo ? byId(t.assignedTo) : null;
			return `
			<div class="task${t.completedAt ? ' is-done' : ''}" data-task="${t.id}">
			  <span class="task__box" onclick="toggle('${t.id}')" role="checkbox" aria-checked="${!!t.completedAt}" tabindex="0"></span>
			  <span style="flex:1;min-width:0">
			    <span class="task__t">${t.title}</span>
			    <span class="task__m">${metaOf(t, a)}</span>
			  </span>
			  <button class="btn-icon" style="height:1.75rem;width:1.75rem;flex:none" title="Edit" onclick="toast('EditTaskDialog — the real page has one')">✎</button>
			</div>`;
		  }).join('')}
		</div>`).join('') || '<div class="band" style="text-align:center;padding:2.5rem"><p class="hint">Nothing here.</p></div>';
}
paint();

filters.addEventListener('click', (e) => {
	const c = e.target.closest('[data-chip]');
	if (!c) return;
	chip = c.dataset.chip;
	filters.querySelectorAll('[data-chip]').forEach((x) => x.classList.toggle('is-on', x === c));
	paint();
});
/* Typing filters live and the band title counts the matches, so the row is
   never a control that did nothing. `type="search"` also gives a native
   clear ✕ for free — at 115px wide (the 320px case) a bespoke clear button
   would cost a fifth of the field. */
filters.querySelector('#q').addEventListener('input', (e) => { q = e.target.value; paint(); });

/* ── assignment inbox — ONE band, two lists, not two loose cards ────────
   The real AssignmentsCard is a tabbed card: "To accept (n)" and
   "Requested (n)". Tabs hide half the band, so this resolves them into two
   stacked sections inside one card — every row framed, 8px between rows, and
   Accept and Decline as two labelled buttons rather than a labelled Accept
   beside a bare ✕. */
const inbox = el('div', 'band');
inbox.setAttribute('data-fb', 'assignment-inbox');
inbox.setAttribute('data-fb-label', 'Assignment inbox');
inbox.innerHTML = `
	<div class="band__t">Assignments <em>${ASSIGNMENT_INBOX.length + SENT_REQUESTS.length} waiting</em></div>
	<p class="hint" style="line-height:1.7;margin:-.25rem 0 .75rem">Tasks you've been sent, and ones you sent out.
	The real page tabs these; both are open here so neither list hides the other.</p>
	<div class="sect">To accept (${ASSIGNMENT_INBOX.length})</div>
	${ASSIGNMENT_INBOX.map((a) => `
	  <div class="inbox-row" id="ib-${a.id}">
	    <span style="grid-column:1/-1;min-width:0">
	      <b>${a.title}</b>
	      <span class="meta">From ${nameOf(a.from).split(' ')[0]} · due ${a.due}</span>
	    </span>
	    <span class="resp">
	      <button class="yes" onclick="respond('${a.id}',1)">✓ Accept</button>
	      <button class="no" onclick="respond('${a.id}',0)">✕ Decline</button>
	    </span>
	  </div>`).join('')}
	<div class="sect">You asked for (${SENT_REQUESTS.length})</div>
	<div id="sent-requests" data-fb="sent-requests" data-fb-label="Sent requests"></div>`;
right.appendChild(inbox);

const sent = inbox.querySelector('#sent-requests');
function paintSent() {
	sent.innerHTML = SENT_REQUESTS.map((r) => `
	  <div class="inbox-row sent">
	    <span style="grid-column:1/-1;min-width:0">
	      <b>${r.title}</b>
	      <span class="meta">To ${nameOf(r.to).split(' ')[0]}</span>
	    </span>
	    <span class="pill" style="background:${r.status === 'accepted' ? 'var(--mint)' : r.status === 'declined' ? 'var(--s100)' : '#fdf0cf'};color:${r.status === 'accepted' ? 'var(--mint-ink)' : r.status === 'declined' ? 'var(--s500)' : '#92610a'}">${r.status}</span>
	  </div>`).join('');
}
paintSent();

/* ── model note ─────────────────────────────────────────────────────── */
right.appendChild(card(
	`<div class="band__t">How a repeat actually works</div>
	 <p class="hint" style="line-height:1.7">
	   A repeating task is <b>one row</b>, and <code>dueDate</code> is a <b>cursor</b> that advances on completion. So <code>completedAt</code> is overwritten every time and cannot be history.
	 </p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">
	   That is why <code>taskCompletions</code> exists as a separate immutable table: it is the only reason streaks and the stats page work. “Done 12×” on the weekly meal plan is counting rows, not reading a counter.
	 </p>
	 <a class="btn btn-soft btn-sm" href="models.html" style="margin-top:.75rem">See the model</a>`,
	'model-note', 'Recurrence model',
	'background:linear-gradient(140deg,rgba(190,218,227,.32),#fff)'));

window.toggle = (id) => { const t = TASKS.find((x) => x.id === id); t.completedAt = t.completedAt ? null : new Date().toISOString(); paint(); toast(t.completedAt ? `Completed “${t.title}”` : 'Undone'); };
window.respond = (id, ok) => {
	const row = document.getElementById('ib-' + id);
	if (!row) return;
	row.remove();
	const a = ASSIGNMENT_INBOX.find((x) => x.id === id);
	toast(ok ? `Accepted “${a.title}”` : `Declined “${a.title}”`);
};
window.addTask = (e) => { e.preventDefault(); const i = document.getElementById('newTask'); if (!i.value.trim()) return; toast(`Added “${i.value.trim()}”`); i.value = ''; };
window.toast = toast;

mountApp({
	head: {
		kicker: 'Prototype · Tasks',
		title: 'Tasks',
		lede: 'My tasks, and a separate band for things other people asked me to do. The real page links to nothing — every action is an API call — so this one earns its cross-links.',
		actions: `<a class="btn btn-soft btn-sm" href="family-tasks.html">Family tasks</a><a class="btn btn-soft btn-sm" href="stats.html">Stats</a>`
	},
	body: main
});
</script>
</body>
</html>
