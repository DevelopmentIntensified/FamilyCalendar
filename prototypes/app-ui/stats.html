<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stats — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "stats", "label": "Stats", "family": "app-ui",
  "question": "Streaks, and more streaks. Does the completion history earn a whole page?",
  "thesis": "Yes — but only because of one immutable table: without taskCompletions none of this can be computed. That card was cut at review (“remove this”); the claim survives one line under the title and, in full, on tasks.html and models.html.",
  "realPage": "src/routes/(calendar)/calendar/stats/ — +page.svelte 113"
}
</script>
<style>
	.sg { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
	@media (min-width: 900px) { .sg { grid-template-columns: repeat(2, minmax(0,1fr)); } }
	@media (min-width: 1280px) { .sg { grid-template-columns: repeat(3, minmax(0,1fr)); } }
	/* MARK 5. The hero used to own columns 1–2 of row 1, which put "This
	   month" in column 3 and left "Recently completed" stranded in row 3.
	   Now the hero takes columns 2–3 and the recent list takes column 1, so
	   the list sits directly above "This month" at every width — grid flow,
	   not a hardcoded row number. */
	.sg-streak { grid-column: span 2; }
	@media (max-width: 899px) { .sg-streak { grid-column: auto; } }
	@media (min-width: 1280px) { .sg-streak { grid-column: 2 / span 2; } }
	.sg-full { grid-column: 1 / -1; }
	/* MARK 6. One row, one height, decided by the layout rather than by a
	   min-height that goes stale when the copy changes. It is its own grid so
	   the stretch is confined to this row and does not inflate the hero. */
	.sgrow { display: grid; gap: 1rem; grid-template-columns: minmax(0,1fr); align-items: stretch; }
	@media (min-width: 700px) { .sgrow { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); } }
	/* the footnote argument spans the row, so its three paragraphs become
	   three columns rather than three 150-character lines */
	.argcols { display: grid; gap: .5rem; }
	@media (min-width: 900px) { .argcols { grid-template-columns: repeat(3, minmax(0,1fr)); gap: .5rem 1.5rem; align-items: start; } }
	.big { font-size: 3rem; font-weight: 800; letter-spacing: -.035em; line-height: 1; color: var(--s900); }
	.weekgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .5rem; margin-top: 1rem; }
	.wk { display: flex; flex-direction: column; align-items: center; gap: .375rem; }
	.wk i { display: block; height: 2.25rem; width: 100%; border-radius: .5rem; background: var(--s100); }
	.wk.on i { background: var(--mint); }
	.wk.today i { outline: 2px solid var(--terracotta); outline-offset: 1px; }
	.wk b { font-size: .5625rem; font-weight: 700; color: var(--s400); text-transform: uppercase; }
	.wk.on b { color: var(--s800); }
	.bar { display: flex; align-items: center; gap: .625rem; padding: .4375rem 0; }
	.bar__l { font-size: .8125rem; font-weight: 600; color: var(--s700); width: 6.5rem; flex: none; }
	.bar__t { flex: 1; height: .625rem; border-radius: 9999px; background: var(--s100); overflow: hidden; }
	.bar__t i { display: block; height: 100%; border-radius: 9999px; }
	.bar__n { font-size: .75rem; font-weight: 700; color: var(--s500); width: 2rem; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
	.rc { display: flex; align-items: center; gap: .625rem; padding: .5rem 0; font-size: .875rem; }
	.rc + .rc { border-top: 1px solid var(--s100); }
	.rc__t { flex: 1; min-width: 0; color: var(--s800); }
	.rc__w { font-size: .75rem; color: var(--s400); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';
import { STATS, MEMBERS, byId, nameOf } from './app-data.js';

const sg = el('div', 'sg');

/* ── streak ──────────────────────────────────────────────────────────── */
const streak = el('div', 'card sg-streak');
streak.setAttribute('data-fb', 'streak');
streak.setAttribute('data-fb-label', 'Streak');
const WEEKS = [1, 1, 1, 0, 1, 1, 0];
streak.style.cssText = 'padding:1.5rem;background:linear-gradient(140deg,rgba(254,213,207,.45),#fff 60%)';
streak.innerHTML = `
	<div class="rowflex between gap-4" style="flex-wrap:wrap">
	  <div>
	    <div class="hint" style="text-transform:uppercase;letter-spacing:.08em;font-size:.625rem;font-weight:700">Current streak</div>
	    <div class="big" style="margin-top:.375rem">${STATS.streak.weeks}<span style="font-size:1rem;font-weight:700;letter-spacing:0;margin-left:.375rem">weeks</span></div>
	    <div class="hint" style="margin-top:.375rem">Best: ${STATS.streak.best} weeks${STATS.streak.frozen ? ' · one frozen' : ''}</div>
	  </div>
	  <div class="weekgrid" style="margin:0;min-width:13rem">
	    ${WEEKS.map((on, i) => `<span class="wk${on ? ' on' : ''}${i === 6 ? ' today' : ''}"><i></i><b>W${i + 1}</b></span>`).join('')}
	  </div>
	</div>
	<p class="hint" style="line-height:1.7;margin-top:1rem">Six weeks of “at least one task completed”. A
	week is the smallest unit that survives a normal family week, and it is the unit a missed Sunday does not
	erase.</p>`;
sg.appendChild(streak);

/* ── recently completed — moved up, directly above "This month" ────────── */
sg.appendChild(card(
	`${sectionTitle('Recently completed')}
	 ${STATS.recentlyCompleted.map((r) => `
	   <div class="rc">
	     <span class="rc__t truncate">${r.title}</span>
	     ${r.recurring ? '<span class="pill pill-xs pill-token">↻ repeating</span>' : ''}
	     <span class="rc__w">${r.when}</span>
	   </div>`).join('')}
	 <p class="hint" style="line-height:1.7;margin-top:.625rem">The repeating tag is not a flag on the task —
	 it is <code>recurrence_frequency IS NOT NULL</code> on the same row, shown next to a timestamp that lives
	 in a different table.</p>`,
	'recently', 'Recently completed'));

/* ── one row, one height: the totals card and the two bar cards share it ─ */
const row = el('div', 'sgrow sg-full');
row.appendChild(card(
	`${sectionTitle('This month')}
	 <div class="rowflex gap-5" style="flex-wrap:wrap;margin-top:.25rem">
	   <div><div class="big" style="font-size:2rem">${STATS.completed}</div><div class="hint">completed</div></div>
	   <div><div class="big" style="font-size:2rem">${STATS.recurring}</div><div class="hint">of them recurring</div></div>
	 </div>`,
	'totals', 'This month'));

/* ── most assigned to / by ────────────────────────────────────────────── */
function bars(rows, field) {
	const max = Math.max(...rows.map((r) => r.count));
	return rows.map((r) => {
		const m = byId(r.who);
		return `
		<div class="bar">
		  <span class="bar__l">${m.firstName}</span>
		  <span class="bar__t"><i style="width:${(r.count / max) * 100}%;background:${m.tint === 'blush' ? '#e87539' : m.tint === 'blue' ? '#5b9fb5' : m.tint === 'mint' ? '#4d9c85' : '#d38248'}"></i></span>
		  <span class="bar__n">${r.count}</span>
		</div>`;
	}).join('');
}
row.appendChild(card(`${sectionTitle('Tasks land on')}${bars(STATS.mostAssignedTo)}`, 'most-to', 'Most assigned to'));
row.appendChild(card(`${sectionTitle('Tasks come from')}${bars(STATS.mostAssignedBy)}`, 'most-by', 'Most assigned by'));
sg.appendChild(row);

/* ── the argument: children are counted, but never act ───────────────── */
const kids = card(
	`${sectionTitle('Mia and Eli are in the numbers')}
	 <div class="argcols">
	   <p class="hint" style="margin:0;padding:.375rem .5rem;border-radius:.5rem;background:var(--s100)">Most assigned to: Jon 14, Sarah 9, Mia 4, Eli 3</p>
	   <p class="hint" style="line-height:1.7;margin:0">A child is a row in <code>users</code>, so a task can be assigned
	 to them and counted in the stats. But <code>taskCompletions.actorId</code> is who actually did it — and a
	 child has no <code>passwordHash</code>, so they can never be the actor.</p>
	   <p class="hint" style="line-height:1.7;margin:0">So Mia can be assigned four things and complete
	 none of them, and the chart cannot tell that case apart from “she has not got round to it”. The stat says
	 <i>assigned to</i>; the page above says <i>done by</i>. Only one of them is true about the children.</p>
	 </div>`,
	'children-stat', 'The children are in the numbers',
	'background:linear-gradient(140deg,rgba(254,202,202,.4),#fff);border-color:#fecaca');
kids.classList.add('sg-full');
sg.appendChild(kids);

window.toast = toast;
mountApp({
	head: {
		kicker: 'Prototype · Stats',
		title: 'Task stats',
		lede: 'Everything here is a read of <code>taskCompletions</code>, the one immutable table that exists only because the recurrence cursor overwrites history.',
		actions: `<a class="btn btn-soft btn-sm" href="tasks.html">Tasks</a><a class="btn btn-soft btn-sm" href="family-tasks.html">Family board</a>`
	},
	body: sg
});
</script>
</body>
</html>
