<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archive — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "archive", "label": "Archive", "family": "app-ui",
  "question": "Does anyone ever come back here, or is this dead weight behind a paywall?",
  "thesis": "Shown behind its real gate, with the retention numbers on screen so the gate makes sense.",
  "realPage": "src/routes/(calendar)/calendar/archive/ — +page.svelte 55. Gated on activeSubscriptions.retentionViewDays (365) and archivedRetentionDays (730). Nothing links here except the navbar."
}
</script>
<style>
	/* minmax(0,1fr) at every width, not just the two-column one: a bare 1fr track
	   lets a grid item keep its min-content width, and once .month grew real
	   padding that min-content (322px) pushed the whole column 26px past a
	   320px viewport. */
	.ar { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
	@media (min-width: 1000px) { .ar { grid-template-columns: minmax(0,1fr) 19rem; } }
	/* MARK "padding…". Measured: .card carries NO padding (proto.css:95-97),
	   .month declared padding:0 to match, and the rows were pulled back out
	   with margin:0 -1rem and clipped by overflow:hidden — so each .row box
	   was 30px WIDER than the card and sat 15px outside its frame on both
	   sides, and the header sat ON the frame. The rows now live in the card's
	   own content box, so the month header and the rows share one 1rem inset
	   instead of arriving there by accident. */
	.month { padding: 1rem; }
	.row { display: flex; align-items: center; gap: .75rem; padding: .75rem 0; text-decoration: none; flex-wrap: wrap; row-gap: .25rem; }
	.row + .row { border-top: 1px solid var(--s100); }
	.row__w { font-size: .8125rem; color: var(--s500); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* below 420px the date takes its own line and the title, the calendar pill
	   and the place share the second one — measured at 320px: on one line the
	   place was 12px past the frame and clipped by body{overflow-x:hidden}. */
	@media (max-width: 419px) { .row__d { width: 100%; } }
	.row__d { font-size: .75rem; font-weight: 700; color: var(--s400); width: 5.5rem; flex: none; font-variant-numeric: tabular-nums; }
	.row__t { flex: 1; min-width: 0; font-size: .9375rem; font-weight: 600; color: var(--s800); }
	.sw { height: .625rem; width: .625rem; border-radius: 9999px; flex: none; }
	.swp { font-size: .6875rem; padding: .1875rem .4375rem; border-radius: 9999px; font-weight: 600; }
	.gate { border: 1px dashed var(--s300); background: var(--canvas); }
	.scale { display: flex; flex-direction: column; gap: .4375rem; margin-top: .25rem; }
	.scale div { display: flex; align-items: center; gap: .5rem; font-size: .75rem; }
	.scale b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--s800); }
	.trackbar { height: .5rem; border-radius: 9999px; background: var(--s200); overflow: hidden; display: flex; }
	.trackbar i:first-child { background: var(--p600); }
	.trackbar i:last-child { background: var(--s300); }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';
import { ARCHIVE, PLAN, USAGE } from './app-data.js';

const CAL = { fam: ['#e87539', 'rgba(254,213,207,.6)'], kids: ['#4d9c85', 'rgba(196,233,218,.6)'], school: ['#5b9fb5', 'rgba(190,218,227,.6)'] };

const ar = el('div', 'ar');
const main = el('div', 'vstack');
const side = el('div', 'vstack');
ar.appendChild(main);
ar.appendChild(side);

/* ── the gate, shown as a gate ───────────────────────────────────────── */
const gate = el('div', 'rail__card gate');
gate.setAttribute('data-fb', 'retention-gate');
gate.setAttribute('data-fb-label', 'The retention gate');
gate.innerHTML = `
	<div class="rowflex between gap-3" style="flex-wrap:wrap">
	  <div>
	    <div class="hint" style="text-transform:uppercase;letter-spacing:.08em;font-size:.625rem;font-weight:700">On the ${PLAN.name} plan</div>
	    <div style="font-size:1.25rem;font-weight:800;color:var(--s900);margin-top:.25rem">You can look back ${PLAN.retentionViewDays} days</div>
	    <div class="hint" style="margin-top:.25rem">and events stay in the archive for ${PLAN.archivedRetentionDays} days</div>
	  </div>
	  <span class="pill pill-xs pill-mint">${USAGE.families} family</span>
	</div>
	<div class="trackbar" style="margin-top:1rem">
	  <i style="width:25%"></i><i style="width:25%"></i><i style="width:25%"></i><i style="width:25%"></i>
	</div>
	<div class="scale">
	  <div><span class="sw" style="background:var(--p600)"></span>Viewable now<span><b>365 days</b></span></div>
	  <div><span class="sw" style="background:var(--s300)"></span>Kept, not viewable<span><b>next 365</b></span></div>
	  <div><span class="sw" style="background:var(--s100)"></span>Deleted<span><b>after 730</b></span></div>
	</div>
	<p class="hint" style="line-height:1.7;margin-top:.875rem">The gate is real, but it is stated as a
	<em>plan limit</em> rather than a date. A family looking for a memory from three years ago is told to
	upgrade, not that it is gone.</p>`;
main.appendChild(gate);

/* ── the archive, grouped by year-month ──────────────────────────────── */
const groups = {};
ARCHIVE.forEach((a) => { const k = a.date.split(' ').slice(1).join(' '); (groups[k] = groups[k] || []).push(a); });
const list = el('div');
list.setAttribute('data-fb', 'archive-list');
list.setAttribute('data-fb-label', 'Archived events');
list.innerHTML = Object.entries(groups).map(([k, rows]) => `
	<div class="card month" style="margin-bottom:1rem">
	  ${sectionTitle(k, `<span class="hint">${rows.length} event${rows.length === 1 ? '' : 's'}</span>`)}
	  ${rows.map((a) => `
	    <a class="row" href="event.html">
	      <span class="row__d">${a.date}</span>
	      <span class="row__t">${a.title}</span>
	      <span class="swp" style="background:${CAL[a.cal][1]};color:${CAL[a.cal][0]}">${a.cal}</span>
	      <span class="row__w">${a.where || ''}</span>
	    </a>`).join('')}
	</div>`).join('');
main.appendChild(list);

/* ── the question this page should be answering ──────────────────────── */
side.appendChild(card(
	`${sectionTitle('What is this for?')}
	 <p class="hint" style="line-height:1.7">A flat chronological list of events whose time has passed. No
	 search, no filter, no by-calendar, no paging — and nothing in the app links here except the navbar.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">If a family wants “when was Mia’s first football
	 match”, this page cannot answer it. If they want “remind me of what we did last summer”, it could — but
	 it never says that.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">A by-year view with the kids’ milestones pinned
	 would earn the page. A 55-line list of past events will not get opened twice.</p>`,
	'archive-purpose', 'What is this for?',
	'background:linear-gradient(140deg,rgba(190,218,227,.4),#fff);border-color:transparent'));

side.appendChild(card(
	`${sectionTitle('Recurring events stop here')}
	 <p class="hint" style="line-height:1.7"><code>eventExceptions</code> is read by the calendar grid and
	 <b>not</b> by the archive. So an occurrence you moved or cancelled still appears in the archive at its
	 original time, and a cancelled one appears at all.</p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">The archive is a record of intent, not of what
	 happened.</p>`,
	'archive-exceptions', 'Recurring events stop here',
	'background:linear-gradient(140deg,rgba(254,202,202,.4),#fff);border-color:#fecaca'));

side.appendChild(card(
	`${sectionTitle('Nothing links here')}
	 <p class="hint" style="line-height:1.7">Not the calendar, not the family page, not the event detail. The
	 archive is one navbar item with 55 lines behind it.</p>
	 <div class="rowflex gap-2" style="margin-top:.75rem">
	   <a class="btn btn-soft btn-sm" href="../calendar-ui/d-working-calendar.html">Calendar</a>
	 </div>`,
	'archive-links', 'Nothing links here'));

window.toast = toast;
mountApp({
	head: {
		kicker: 'Prototype · Archive',
		title: 'Archive',
		lede: 'Behind the plan gate, with the retention numbers on screen. The page works; the argument for it is thinner than the gate.',
		actions: `<a class="btn btn-soft btn-sm" href="account.html">Plan &amp; usage</a>`
	},
	body: ar
});
</script>
</body>
</html>
