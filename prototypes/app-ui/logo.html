<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo prototypes - FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<style>
	/* Direction columns. 3 across on desktop, stacked on a phone. */
	.dirgrid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
	@media (min-width: 900px) { .dirgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

	.dhead { display: flex; align-items: center; gap: .75rem; }
	.dname { font-size: 1.0625rem; font-weight: 800; letter-spacing: -.01em; color: var(--s900); margin: 0; }
	.dtag { font-size: .6875rem; font-weight: 600; color: var(--s500); margin: 0; }
	.didea { font-size: .875rem; line-height: 1.6; color: var(--s600); margin: 0; }
	.drisk { font-size: .8125rem; line-height: 1.6; color: var(--peach-ink); margin: 0;
		background: var(--blush); border-radius: .75rem; padding: .625rem .75rem; }

	/* the survivability rows */
	.cell { display: flex; flex-direction: column; gap: .75rem; }
	.cell__k { font: 600 .6875rem/1 inherit; color: var(--s400); letter-spacing: .04em; text-transform: uppercase; }

	.ladder { display: flex; align-items: flex-end; gap: 1.25rem; flex-wrap: wrap; }
	.ladder figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .375rem; }
	.ladder figcaption { font: 400 .625rem/1 ui-monospace, Menlo, monospace; color: var(--s400); }

	/* browser tab - the only size that really matters */
	.tab { display: flex; align-items: center; gap: .5rem; width: 13.5rem; max-width: 100%;
		padding: .5rem .75rem; border-radius: .625rem .625rem 0 0; background: #fff;
		box-shadow: inset 0 0 0 1px var(--s200); font-size: .8125rem; color: var(--s600); }
	.tab__t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
	.tab__x { color: var(--s400); font-size: .875rem; }

	/* the real navbar, with this direction's mark dropped in */
	.navb { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
		padding: .75rem .875rem; background: #fff; border-radius: .75rem; box-shadow: inset 0 0 0 1px var(--s200); }
	.navb__lock { display: flex; align-items: center; gap: .5rem; min-width: 0; }
	.navb__w { font-size: 1.25rem; font-weight: 700; color: var(--s800); white-space: nowrap; }
	.navb__links { display: none; gap: 1.5rem; font-size: .875rem; font-weight: 500; color: var(--s600); }
	@media (min-width: 560px) { .navb__links { display: flex; } }

	/* marketing hero lockup */
	.hero3 { display: flex; align-items: center; gap: .875rem; padding: 1.5rem; border-radius: 1.25rem;
		background: linear-gradient(135deg, rgba(254,213,207,.42), #fff 55%, rgba(190,218,227,.42)); }
	.hero3 span { font-size: 1.75rem; font-weight: 800; letter-spacing: -.02em; color: var(--s900); }

	/* one-colour contexts: watermark, print, embroidery */
	.monos { display: flex; gap: .625rem; }
	.mono { flex: 1; display: flex; align-items: center; justify-content: center; gap: .625rem;
		padding: .875rem .625rem; border-radius: .75rem; font: 600 .625rem/1 inherit; }
	.mono--ink { background: #fff; color: var(--s900); box-shadow: inset 0 0 0 1px var(--s200); }
	.mono--rev { background: var(--terracotta); color: #fff; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="application/json" id="fb-page">
{
  "id": "app-logo", "label": "Logo directions", "family": "app-ui",
  "question": "The repo has no logo - it has two unrelated marks in two palettes that are not the brand. Which of three directions should become the mark, and does it survive at 16px and in one colour?",
  "thesis": "One palette, three shapes. The palette is the one prototypes/calendar-ui/0-current.html:245 names as the brand - cream, blush, powder blue, mint, peach, lavender - and each tile is paired the way .chip--* pairs a tint with its ink. Nothing here is won by colour; the only variable is shape. The survivability contexts are the real comparison - a pretty SVG that dies at 16px is not a logo.",
  "realPage": "static/icon.svg + src/lib/components/Navbar.svelte:68-79"
}
</script>
<script type="module">
import { mountApp, card, el } from './app-shell.js';

/* Scoped in an IIFE on purpose. app-check.mjs evals app-data.js + app-shell.js
   + this file in ONE shared scope, so a bare top-level 'function navbar' silently
   overwrites the shell's own navbar and breaks the mount. An IIFE makes that
   class of collision impossible.

   TRAP, and it is a nasty one: the statement above has to stay outside the IIFE,
   because ES modules only allow it at the top level. And this whole comment
   must never contain a line that BEGINS with the word "import" — app-check
   strips module plumbing with /^\s*import[^;]+;\s*$/gm, \s matches newlines, so
   such a line silently swallows everything up to the next semicolon and the
   page fails to parse with a baffling "Unexpected token }". */
(() => {
	/* Every colour below is a proto.css token. Nothing here is a raw hex - if the
	   brand moves, these marks move with it. */
	const DIR = [
		{
			key: 'a', name: 'A · The Grid', tag: 'The tool',
			tile: 'var(--blush)', ink: 'var(--terracotta)',
			idea: 'A month, abstracted until it is four squares — and one of them is lit. It says "this is a calendar" in the first glance, and it is the shape the navbar already teaches people.',
			risk: 'A grid of squares is the most copied form in scheduling software. The lit cell is the only thing that could be ours.',
			glyph: (c) => `
				<rect x="11" y="11" width="11.5" height="11.5" rx="2.5" fill="${c}"/>
				<rect x="25.5" y="11" width="11.5" height="11.5" rx="2.5" fill="${c}" opacity=".34"/>
				<rect x="11" y="25.5" width="11.5" height="11.5" rx="2.5" fill="${c}" opacity=".34"/>
				<rect x="25.5" y="25.5" width="11.5" height="11.5" rx="2.5" fill="${c}" opacity=".34"/>`
		},
		{
			key: 'b', name: 'B · The Hearth', tag: 'The home',
			tile: 'var(--peach)', ink: 'var(--peach-ink)',
			idea: 'A roof over a body, in peach over the terracotta ink, the warmest pairing in the family. It sells the outcome — one household, one week — instead of the product.',
			risk: 'A house is the most generic silhouette in existence, and the roofline is the first thing to turn to mush at 16px.',
			glyph: (c) => `
				<path d="M11.5 25.5 24 13.5 36.5 25.5" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M15 24h18v10.5A2.5 2.5 0 0 1 30.5 37h-13A2.5 2.5 0 0 1 15 34.5z" fill="${c}"/>`
		},
		{
			key: 'c', name: 'C · The Monogram', tag: 'The brand',
			tile: null, ink: 'var(--terracotta)',
			idea: 'An F whose middle arm closes into the bowl of a P, drawn as pure stroke. No container — which means it is the only one of the three that is not a box with a picture on it.',
			risk: 'A hairline outline has no silhouette of its own, so it needs a light background to read, and it is the thinnest of the three at 16px.',
			glyph: (c) => `
				<g fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
					<path d="M18 12.5v23"/>
					<path d="M18 16.5h7a5.75 5.75 0 0 1 0 11.5h-7"/>
					<path d="M18 33.5h9.5"/>
				</g>`
		}
	];

	/** One mark at one size. `tile:null` is how a direction drops its container. */
	function mark(d, px, o = {}) {
		const tile = 'tile' in o ? o.tile : d.tile;
		const ink = o.ink || d.ink;
		return `<svg viewBox="0 0 48 48" width="${px}" height="${px}" style="width:${px}px;height:${px}px;flex:none;display:block" aria-hidden="true">${
			tile ? `<rect width="48" height="48" rx="12" fill="${tile}"/>` : ''}${d.glyph(ink)}</svg>`;
	}

	const lockup = (d, px, word) => `<div class="navb__lock">${mark(d, px)}<span class="navb__w">${word}</span></div>`;

	/** el() takes HTML, not nodes. This appends real nodes. */
	const wrap = (cls, ...nodes) => { const n = el('div', cls); nodes.forEach((x) => n.appendChild(x)); return n; };

	/* ── what is shipping as "the logo" today ────────────────────────────────
	   static/icon.svg, inlined with its classes flattened to fills. It is a
	   stock SVG-Repo asset: pastel blue and coral, neither of which is in the
	   brand palette. This is what the manifest and apple-touch-icon ship. */
	const TODAY_ICON = `<svg viewBox="0 0 120 120" width="72" height="72" style="flex:none;display:block;border-radius:1rem" aria-hidden="true">
		<path fill="#F9F9F9" d="M17.1,107.4h85.7V39.7c0-10-8.1-18.1-18.1-18.1H35.2c-10,0-18.1,8.1-18.1,18.1V107.4z"/>
		<path fill="#77D6FF" d="M17.1,38.5v8.3h85.7v-8.3c0-9.3-7.6-16.9-16.9-16.9H34C24.7,21.6,17.1,29.2,17.1,38.5z"/>
		<ellipse fill="#60C0E2" cx="42" cy="34.9" rx="5.3" ry="5.3" transform="matrix(0.7071 -0.7071 0.7071 0.7071 -12.3403 39.9119)"/>
		<ellipse fill="#60C0E2" cx="60" cy="34.9" rx="5.3" ry="5.3" transform="matrix(0.9732 -0.2298 0.2298 0.9732 -6.4023 14.7176)"/>
		<ellipse fill="#60C0E2" cx="78" cy="34.9" rx="5.3" ry="5.3" transform="matrix(0.9732 -0.2298 0.2298 0.9732 -5.921 18.8514)"/>
		<path fill="#DEF4FF" d="M42,12.6c-2.1,0-3.9,1.7-3.9,3.9v16.6c0,2.1,1.7,3.9,3.9,3.9s3.9-1.7,3.9-3.9V16.5C45.9,14.4,44.1,12.6,42,12.6z"/>
		<path fill="#DEF4FF" d="M78,12.6c-2.1,0-3.9,1.7-3.9,3.9v16.6c0,2.1,1.7,3.9,3.9,3.9s3.9-1.7,3.9-3.9V16.5C81.9,14.4,80.1,12.6,78,12.6z"/>
		<path fill="#DEF4FF" d="M60,12.6c-2.1,0-3.9,1.7-3.9,3.9v16.6c0,2.1,1.7,3.9,3.9,3.9s3.9-1.7,3.9-3.9V16.5C63.9,14.4,62.1,12.6,60,12.6z"/>
		<path fill="#FFDB86" d="M84.5,95.7l-6.8,6c-0.5,0.5-1.4,0.1-1.5-0.6L75.4,92c0-0.1,0-0.3,0.1-0.4l14.2-35.1c0.2-0.5,0.7-0.7,1.2-0.5l7.6,3.1c0.5,0.2,0.7,0.7,0.5,1.2L84.7,95.3C84.7,95.5,84.6,95.6,84.5,95.7z"/>
		<path fill="#F27D75" d="M95.5,68.7l-9.2-3.7l3.1-7.6c0.4-0.9,1.4-1.3,2.3-1l6,2.4c0.9,0.4,1.3,1.4,1,2.3L95.5,68.7z"/>
		<path fill="#A4E7FF" d="M27.2,57h13.1v8.3H27.2zM45.9,57H59v8.3H45.9zM27.2,70.4h13.1v8.3H27.2zM45.9,70.4H59v8.3H45.9zM27.2,83.8h13.1v8.3H27.2zM45.9,83.8H59v8.3H45.9z"/>
		<path fill="#F27D75" d="M63.9,57H77v8.3H63.9zM63.9,70.4H77v8.3H63.9z"/>
	</svg>`;

	const TODAY_NAVBAR = `<svg viewBox="0 0 24 24" width="32" height="32" style="flex:none;display:block;color:var(--p600)" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
		<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
	</svg>`;

	/* ── the two tests every direction has to pass, in every size ─────────── */
	function ladder(d) {
		return `<div class="ladder">${[16, 24, 32, 48, 96].map((s) =>
			`<figure>${mark(d, s)}<figcaption>${s}</figcaption></figure>`).join('')}</div>`;
	}
	function tabbed(d) {
		return `<div class="tab">${mark(d, 16)}<span class="tab__t">Family Planz</span><span class="tab__x">&#215;</span></div>`;
	}
	function navbar(d) {
		return `<div class="navb">${lockup(d, 32, 'Family Planz')}<span class="navb__links">Dashboard Tasks Groceries Family</span></div>`;
	}
	function hero(d) {
		return `<div class="hero3">${mark(d, 56)}<span>Family Planz</span></div>`;
	}
	function mono(d) {
		return `<div class="monos">
			<span class="mono mono--ink">${mark(d, 24, { tile: null, ink: 'var(--s900)' })}1-colour</span>
			<span class="mono mono--rev">${mark(d, 24, { tile: null, ink: 'var(--canvas)' })}reversed</span>
		</div>`;
	}

	const TESTS = [
		{ k: 'App icon', fn: ladder, why: '16px is a favicon. If it is not legible here it is decoration.' },
		{ k: 'Browser tab', fn: tabbed, why: 'Next to eleven other tabs, on a bad screen, next to the URL.' },
		{ k: 'Navbar lockup', fn: navbar, why: 'The real Navbar.svelte, with this mark dropped into its slot.' },
		{ k: 'Marketing hero', fn: hero, why: 'The biggest place the mark ever appears.' },
		{ k: 'One colour', fn: mono, why: 'Watermark, a printed fridge sheet, a single-colour invoice, embroidery.' }
	];

	const body = el('div');
	body.style.cssText = 'display:flex;flex-direction:column;gap:1.25rem';

	/* 1 — the finding that motivates the page */
	body.appendChild(wrap('stack-2', card(`
		<div class="stack-3" style="display:flex;flex-direction:column">
			<div class="rowflex gap-4" style="align-items:center;flex-wrap:wrap">
				${TODAY_ICON}
				<div class="stack-1" style="flex:1;min-width:11rem">
					<div class="dname">There is no logo. There are two, and they are not the brand.</div>
					<div class="dtag">static/icon.svg &mdash; ships as the manifest and apple-touch-icon</div>
				</div>
				${TODAY_NAVBAR}
				<div class="stack-1" style="flex:1;min-width:11rem">
					<div class="dname">A third mark, drawn inline.</div>
					<div class="dtag">Navbar.svelte:68-79 &mdash; Heroicons outline in primary-600</div>
				</div>
			</div>
			<p class="didea">The tab shows a stock SVG-Repo calendar in <b>pastel blue and coral</b> &mdash;
			<b>#77D6FF</b> and <b>#F27D75</b>, neither of which appears anywhere in the brand palette. The app
			shows a different calendar in token orange. A user meets one mark in their tab bar and a
			second one in the product, and neither is the terracotta the marketing site is painted in.</p>
		</div>`, 'logo-today', 'What ships today')));

	/* 2 — the three directions, argued */
	const dhead = el('div', 'dirgrid');
	dhead.setAttribute('data-fb', 'logo-directions');
	dhead.setAttribute('data-fb-label', 'The three directions');
	for (const d of DIR) {
		dhead.appendChild(wrap('stack-3', card(`
			<div class="dhead">${mark(d, 64)}<div class="stack-1"><p class="dname">${d.name}</p><p class="dtag">${d.tag}</p></div></div>
			<p class="didea">${d.idea}</p>
			<p class="drisk"><b>The cost:</b> ${d.risk}</p>
		`, 'logo-dir-' + d.key, 'Direction ' + d.key.toUpperCase())));
	}
	body.appendChild(dhead);

	/* 3 — survivability, one row per test, one column per direction */
	for (const t of TESTS) {
		const row = wrap('stack-2', card(`
			<div class="stack-1">
				<div class="cell__k">${t.k}</div>
				<div class="dtag">${t.why}</div>
			</div>
			<div class="dirgrid">${DIR.map((d) =>
				`<div class="cell" data-fb="logo-${t.k.toLowerCase().replace(/ /g, '-')}-${d.key}" data-fb-label="${t.k} — ${d.name}">${t.fn(d)}</div>`
			).join('')}</div>
		`, 'logo-test-' + t.k.toLowerCase().replace(/ /g, '-'), t.k + ' test'));
		body.appendChild(row);
	}

	/* 4 — the read, stated before anyone falls in love with a shape */
	body.appendChild(wrap(null, card(`
		<div class="stack-3" style="display:flex;flex-direction:column">
			<p class="dname">What the tests say, before anyone picks a favourite</p>
			<p class="didea"><b>A</b> is the only direction that changes nothing a user has already learned &mdash;
			and the least ownable shape on the page. <b>B</b> is the warmest and the most generic, and its roofline
			is the first detail lost at 16px. <b>C</b> is the only one with no container, so it is the only one that
			survives a single colour, a watermark and a printed sheet &mdash; and it is the thinnest line of the three,
			which is a real risk on a cheap phone in daylight.</p>
			<p class="didea">Nobody has seen any of these in a real browser tab on a real OS. That is the only
			size that decides it, and it is the next step, not a judgement call made on a grid.</p>
			<p class="didea"><b>Open:</b> the wordmark is not in question here &mdash; it stays
			<b>Family Planz</b> at <code>--s800</code>, exactly as Navbar.svelte has it. Only the mark is being
			chosen, and only the mark would change in the app.</p>
		</div>`, 'logo-findings', 'Findings')));

	mountApp({
		head: {
			kicker: 'Brand',
			title: 'Which mark?',
			lede: 'Three directions, each a whole brand idea, each measured in the five places the mark actually has to work. Colour is bound to proto.css tokens throughout — nothing here is a raw hex.'
		},
		body
	});
})();
</script>
</body>
</html>
