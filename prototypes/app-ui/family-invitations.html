<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invitations — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "family-invitations", "label": "Invitations", "family": "app-ui",
  "question": "Is a join code the right way to add a second adult, and is it discoverable enough to be used at all?",
  "thesis": "One code, plainly shown, with the link next to it. The real page is reachable only from a link that 404s.",
  "realPage": "src/routes/(family)/family/invitations/ — +page.svelte 238. The family detail page links here as /family/{id}/invitations, which does not exist."
}
</script>
<style>
	.lg { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
	@media (min-width: 900px) { .lg { grid-template-columns: minmax(0,1fr) 18rem; } }
	.codebox { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; padding: 1.125rem; border-radius: 1rem; background: linear-gradient(140deg,rgba(190,218,227,.4),#fff); border: 1px solid rgba(190,218,227,.6); }
	.code { font: 800 1.75rem/1 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--s900); }
	.urlline { font: 500 .8125rem/1.5 ui-monospace, Menlo, monospace; background: var(--canvas); border: 1px solid var(--s200); border-radius: .5rem; padding: .5rem .625rem; word-break: break-all; color: var(--s600); }
	.uses { display: flex; gap: .375rem; }
	.use { height: .5rem; flex: 1; border-radius: 9999px; background: var(--s200); }
	.use.is-on { background: var(--p600); }
	.hist { display: flex; align-items: center; gap: .75rem; padding: .625rem 0; font-size:.875rem; }
	.hist + .hist { border-top: 1px solid var(--s100); }
	.hist__a { height: 1.75rem; width: 1.75rem; border-radius: 9999px; display: grid; place-items: center; font: 800 .625rem/1 inherit; flex: none; }
	.st { display: inline-flex; align-items: center; height: 1.25rem; padding: 0 .5rem; border-radius: 9999px; font: 700 .625rem/1 inherit; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';
import { FAMILY, INVITE, byId, nameOf } from './app-data.js';

const lg = el('div', 'lg');
const main = el('div');
const side = el('div');
lg.appendChild(main);
lg.appendChild(side);

/* ── the live code ───────────────────────────────────────────────────── */
const box = el('div', 'codebox');
box.setAttribute('data-fb', 'active-code');
box.setAttribute('data-fb-label', 'The live join code');
box.innerHTML = `
	<div style="flex:1;min-width:0">
	  <div class="hint" style="text-transform:uppercase;letter-spacing:.08em;font-size:.625rem;font-weight:700">Active code</div>
	  <div class="code">${INVITE.code}</div>
	  <div class="uses" style="margin-top:.75rem;max-width:11rem">
	    ${Array.from({ length: INVITE.maxUses }, (_, i) => `<span class="use${i < INVITE.useCount ? ' is-on' : ''}"></span>`).join('')}
	  </div>
	  <div class="hint" style="margin-top:.375rem">${INVITE.useCount} of ${INVITE.maxUses} used · expires ${INVITE.expiresAt}</div>
	</div>
	<button class="btn btn-primary btn-md" onclick="copyLink()">Copy join link</button>`;
main.appendChild(box);

/* ── the link itself ────────────────────────────────────────────────── */
main.appendChild(card(
	`${sectionTitle('Where the link goes')}
	 <div class="urlline">${INVITE.url}</div>
	 <p class="hint" style="line-height:1.7;margin-top:.625rem">
	   There is no share sheet, no “invite by link” button on the family page, and no email template that contains it.
	   The code exists, the join route exists, and the only place to find them is this page — which the family
	   settings page links to with a URL that 404s.
	 </p>
	 <div class="rowflex gap-2" style="margin-top:.875rem">
	   <a class="btn btn-soft btn-sm" href="family-detail.html">Family settings (broken link)</a>
	   <a class="btn btn-soft btn-sm" href="family.html">Family list (works)</a>
	 </div>`,
	'join-route', 'Where the link goes',
	'background:linear-gradient(140deg,rgba(190,218,227,.4),#fff);border-color:transparent'));

/* ── history ─────────────────────────────────────────────────────────── */
const used = [
	{ who: 'u_sarah', when: '12 Mar 2026', state: 'joined' },
	{ who: 'u_jon', when: '12 Mar 2026', state: 'joined' },
	{ who: null, name: 'nana@hoppers.test', when: '2 Apr 2026', state: 'never signed up' }
];
main.appendChild(card(
	`${sectionTitle('Who has used it')}
	 ${used.map((u) => `
	   <div class="hist">
	     ${u.who
			? `<span class="hist__a" style="background:${byId(u.who).tone}">${byId(u.who).initials}</span>`
			: `<span class="hist__a" style="background:var(--s100);color:var(--s500)">?</span>`}
	     <span style="flex:1;min-width:0">
	       <span style="display:block;font-weight:600;color:var(--s800)">${u.who ? nameOf(u.who) : u.name}</span>
	       <span class="hint">${u.when}</span>
	     </span>
	     <span class="st" style="background:${u.state === 'joined' ? 'rgba(196,233,218,.7);color:#2d5866' : 'var(--s100);color:var(--s500)'}">${u.state}</span>
	   </div>`).join('')}
	 <p class="hint" style="line-height:1.7;margin-top:.75rem">
	   A use is consumed whether or not the person ever signs up, so <code>useCount</code> overstates how many
	   people actually joined. The unused third slot is invisible unless you count the people who did not arrive.
	 </p>`,
	'use-history', 'Who has used it'));

/* ── side: create + revoke ───────────────────────────────────────────── */
side.appendChild(card(
	`${sectionTitle('New code')}
	 <p class="hint" style="line-height:1.65">Creating a new code revokes the current one. Anyone holding the old
	 link stops working immediately.</p>
	 <label class="field" style="margin-top:.875rem">
	   <span class="hint" style="display:block;margin-bottom:.375rem">Valid for</span>
	   <select class="input wide"><option>7 days</option><option>24 hours</option><option>30 days</option><option>Never expires</option></select>
	 </label>
	 <label class="field">
	   <span class="hint" style="display:block;margin-bottom:.375rem">Max uses</span>
	   <input class="input wide" type="number" value="5" min="1" max="20" />
	 </label>
	 <button class="btn btn-primary btn-md wide" style="width:100%" onclick="toast('Old code revoked, new code issued')">Create new code</button>`,
	'create-code', 'New code'));

side.appendChild(card(
	`${sectionTitle('Revoke')}
	 <p class="hint" style="line-height:1.65">Revoking kills the link for anyone who has not used it yet. It
	 cannot un-join somebody who already has.</p>
	 <button class="btn btn-md wide" style="width:100%;margin-top:.75rem;background:#fff;color:#b91c1c;border:1px solid #fecaca" onclick="toast('Code revoked')">Revoke ${INVITE.code}</button>`,
	'revoke-code', 'Revoke',
	'background:linear-gradient(140deg,rgba(254,202,202,.4),#fff);border-color:#fecaca'));

window.copyLink = () => {
	if (navigator.clipboard) navigator.clipboard.writeText(INVITE.url);
	toast('Join link copied', 'Undo');
};
window.toast = toast;

mountApp({
	head: {
		kicker: 'Prototype · Invitations',
		title: `Invite to ${FAMILY.name}`,
		lede: 'A code, a link, and a count. The mechanism works — it is the road to it that is broken.',
		actions: `<a class="btn btn-soft btn-sm" href="family-detail.html">← Family settings</a>`
	},
	body: lg
});
</script>
</body>
</html>
