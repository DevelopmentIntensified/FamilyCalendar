<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family — FamilyPlanz</title>
<link rel="stylesheet" href="proto.css" />
<link rel="stylesheet" href="feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "family", "label": "Family (list)", "family": "app-ui",
  "question": "Is a list of families the right landing page, or should this be a people page?",
  "thesis": "The family as the unit, with the members and modules one click in. Real page is 209 lines; the member page it links to is 793.",
  "realPage": "src/routes/(family)/family/ — +page.svelte 209, +page.server.ts 22"
}
</script>
<style>
	.grid2 { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; }
	@media (min-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr) 19rem; } }
	.famcard { position: relative; overflow: hidden; border-radius: 1.5rem; padding: 1.5rem; }
	.famcard__glow { position: absolute; right: -2.5rem; bottom: -2.5rem; height: 9rem; width: 9rem; border-radius: 9999px; filter: blur(24px); }
	.avatars { display: flex; }
	.avatars span { height: 2.25rem; width: 2.25rem; border-radius: 9999px; display: grid; place-items: center; font: 800 .8125rem/1 inherit; border: 2px solid #fff; }
	.avatars span + span { margin-left: -0.5rem; }
	.mrow { display: flex; align-items: center; gap: .625rem; padding: .625rem 0; }
	.mrow + .mrow { border-top: 1px solid var(--s100); }
	.mrow__n { flex: 1; min-width: 0; }
	.role { display: inline-flex; align-items: center; height: 1.25rem; padding: 0 .5rem; border-radius: 9999px; font: 700 .625rem/1 inherit; text-transform: uppercase; letter-spacing: .04em; }
	.linkrow { display: flex; align-items: center; gap: .625rem; padding: .625rem .75rem; border-radius: .75rem; text-decoration: none; transition: background-color 150ms; }
	.linkrow:hover { background: var(--s50); }
	.invrow { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; }
	.code { font: 800 .875rem/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--s100); padding: .375rem .625rem; border-radius: .375rem; }
</style>
</head>
<body>
<script src="drag.js"></script>
<script src="dock.js"></script>
<script src="feedback.js" defer></script>
<script type="module">
import { mountApp, card, sectionTitle, toast, el } from './app-shell.js';
import { FAMILY, MEMBERS, INVITE, USAGE, PLAN } from './app-data.js';

const grid = el('div', 'grid2');
const main = el('div');
const side = el('div');
grid.appendChild(main);
grid.appendChild(side);

/* ── the family card ────────────────────────────────────────────────── */
const fam = el('a', 'famcard');
fam.href = 'family-detail.html';
fam.setAttribute('data-fb', 'family-card');
fam.setAttribute('data-fb-label', 'Family card');
fam.style.cssText = 'display:block;text-decoration:none;background:linear-gradient(140deg,rgba(254,213,207,.5),#fff 70%);border:1px solid rgba(254,213,207,.6)';
fam.innerHTML = `
	<div class="famcard__glow" style="background:rgba(241,181,152,.4)"></div>
	<div style="position:relative">
	  <div class="rowflex between gap-3" style="flex-wrap:wrap">
	    <div>
	      <div style="font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--s900)">${FAMILY.name}</div>
	      <div class="hint" style="margin-top:.125rem">${MEMBERS.length} members · created 12 March</div>
	    </div>
	    <span class="pill pill-xs pill-mint">${USAGE.families} of ${USAGE.familyLimit} families used</span>
	  </div>
	  <div class="avatars" style="margin-top:1.25rem">
	    ${MEMBERS.map((m) => `<span style="background:${m.tone}">${m.initials}</span>`).join('')}
	  </div>
	  <div class="rowflex gap-2" style="margin-top:1.25rem">
	    <span class="btn btn-primary btn-sm">Open family</span>
	    <span class="btn btn-soft btn-sm">Members</span>
	    <span class="btn btn-soft btn-sm">Family tasks</span>
	  </div>
	</div>`;
main.appendChild(fam);

/* ── what the real page links to ────────────────────────────────────── */
main.appendChild(card(
	`${sectionTitle('Where this goes')}
	 <a class="linkrow" href="family-detail.html" data-fb="link-detail">
	   <span style="height:2rem;width:2rem;border-radius:.625rem;display:grid;place-items:center;background:rgba(254,213,207,.6);color:var(--terracotta);flex:none">
	     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="height:1rem;width:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 10a4 4 0 100-8 4 4 0 000 8z"/></svg>
	   </span>
	   <span style="flex:1"><span style="display:block;font-size:.875rem;font-weight:700;color:var(--s800)">Family settings &amp; members</span>
	   <span class="hint">793 lines — the biggest page in the app</span></span>
	 </a>
	 <a class="linkrow" href="family-members-add.html" data-fb="link-add">
	   <span style="height:2rem;width:2rem;border-radius:.625rem;display:grid;place-items:center;background:rgba(190,218,227,.6);color:var(--blue-ink);flex:none">
	     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="height:1rem;width:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
	   </span>
	   <span style="flex:1"><span style="display:block;font-size:.875rem;font-weight:700;color:var(--s800)">Add a member</span>
	   <span class="hint">3 tabs: search, invite by email, create child</span></span>
	 </a>
	 <a class="linkrow" href="family-tasks.html" data-fb="link-famtasks">
	   <span style="height:2rem;width:2rem;border-radius:.625rem;display:grid;place-items:center;background:rgba(196,233,218,.6);color:var(--mint-ink);flex:none">
	     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="height:1rem;width:1rem"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>
	   </span>
	   <span style="flex:1"><span style="display:block;font-size:.875rem;font-weight:700;color:var(--s800)">Family tasks</span>
	   <span class="hint">Grouped by assignee, not by due date</span></span>
	 </a>
	 <a class="linkrow" href="family-invitations.html" data-fb="link-invites">
	   <span style="height:2rem;width:2rem;border-radius:.625rem;display:grid;place-items:center;background:rgba(241,181,152,.6);color:var(--peach-ink);flex:none">
	     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="height:1rem;width:1rem"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
	   </span>
	   <span style="flex:1"><span style="display:block;font-size:.875rem;font-weight:700;color:var(--s800)">Invitations</span>
	   <span class="hint">Manage and revoke join codes</span></span>
	 </a>`,
	'link-map', 'Where this page goes'));

/* ── members preview ────────────────────────────────────────────────── */
side.appendChild(card(
	`${sectionTitle('Members', `<a class="hint" href="family-detail.html" style="color:var(--terracotta)">Manage →</a>`)}
	 ${MEMBERS.map((m) => `
	   <div class="mrow">
	     <span style="height:2rem;width:2rem;border-radius:9999px;display:grid;place-items:center;background:${m.tone};font:800 .6875rem/1 inherit;flex:none">${m.initials}</span>
	     <span class="mrow__n">
	       <span style="display:block;font-size:.875rem;font-weight:600;color:var(--s800)">${m.firstName} ${m.lastName}</span>
	       <span class="hint">${m.memberType}</span>
	     </span>
	     <span class="role" style="background:${m.role === 'creator' ? 'rgba(241,181,152,.55);color:#84412e' : m.role === 'admin' ? 'rgba(190,218,227,.55);color:#366d7e' : 'var(--s100);color:var(--s500)'}">${m.role}</span>
	   </div>`).join('')}`,
	'members-preview', 'Members',
	'background:rgba(255,255,255,.8)'));

/* ── invitations ────────────────────────────────────────────────────── */
side.appendChild(card(
	`${sectionTitle('Invitations', `<span class="pill pill-xs pill-token">${INVITE.useCount}/${INVITE.maxUses} used</span>`)}
	 <div class="invrow">
	   <span class="code">${INVITE.code}</span>
	   <button class="btn-icon" style="height:1.75rem;width:1.75rem" title="Copy link" onclick="toast('Join link copied')">⧉</button>
	 </div>
	 <div class="hint">Expires ${INVITE.expiresAt}</div>
	 <a class="btn btn-soft btn-sm" href="family-invitations.html" style="width:100%;margin-top:.75rem">Manage invitations</a>`,
	'invites', 'Invitations'));

/* ── a real link bug that is FIXED, shown as fixed ────────────────────── */
side.appendChild(card(
	`${sectionTitle('Link bug — fixed', '<span class="pill pill-xs pill-mint">resolved</span>')}
	 <p class="hint" style="line-height:1.7">
	   The family detail page used to point <b>Manage invitations</b> at
	   <code>/family/{id}/invitations</code>. The braces were <i>not</i> the bug — Svelte interpolates an
	   attribute value like that. The bug was the shape: there is no
	   <code>[familyId]/invitations</code> route, so the link 404ed for every admin.
	 </p>
	 <p class="hint" style="line-height:1.7;margin-top:.5rem">
	   It now points at <code>/family/invitations</code> — the one invitations route, the same one this
	   list page uses. A test fails if that href regresses or if any static href stops naming a real
	   route, so this cannot silently come back.
	 </p>
	 <a class="btn btn-soft btn-sm" href="family-invitations.html" style="margin-top:.75rem">The working page</a>`,
	'dead-link', 'Link bug, now fixed',
	'background:linear-gradient(140deg,rgba(196,233,218,.4),#fff);border-color:transparent'));

window.toast = toast;
mountApp({
	head: {
		kicker: 'Prototype · Family',
		title: 'Your families',
		lede: 'The family is the unit of everything here — the calendar, the tasks, the grocery list and the member permissions all hang off it.',
		actions: `<a class="btn btn-soft btn-sm" href="family-create.html">Create a family</a>`
	},
	body: grid
});
</script>
</body>
</html>
