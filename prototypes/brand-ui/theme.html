<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palette &amp; theme — FamilyPlanz brand</title>
<link rel="stylesheet" href="../app-ui/proto.css" />
<link rel="stylesheet" href="../app-ui/feedback.css" />
<script type="application/json" id="fb-page">
{
  "id": "brand-theme", "label": "Palette & theme", "family": "brand-ui",
  "question": "The marketing pages had no theme — every colour was a Tailwind arbitrary value spelled per class across five files. What does the calendar prototype page actually specify, and is that enough to name?",
  "thesis": "The theme is lifted from prototypes/calendar-ui, not invented: the :root tokens, the hero wash, the four orbs, the four card tints, the glass calendar frame, the button shadows and the 150ms transition. Everything the calendar page spells out ad hoc is named here, so a marketing page can say 'the brand' instead of a hex.",
  "realPage": "prototypes/calendar-ui/proto.css + index.html — the design language this is read off; and src/lib/marketing/theme.css, where it now lives"
}
</script>
<style>
	.grp { margin-bottom: 2rem; }
	.grp:last-child { margin-bottom: 0; }
	.grp__h { display: flex; align-items: baseline; gap: .625rem; margin-bottom: .75rem; }
	.grp__h h2 { margin: 0; font-size: 1.0625rem; font-weight: 800; letter-spacing: -.01em; color: var(--s900); }
	.grp__h .hint { font-size: .8125rem; }
	.sw { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
	.sw figure { margin: 0; }
	.sw__c { height: 3.25rem; border-radius: .75rem; border: 1px solid rgba(15,23,42,.08); }
	.sw__n { margin-top: .375rem; font: 800 .75rem/1.3 ui-monospace, Menlo, monospace; color: var(--s900); }
	.sw__h { font: 400 .6875rem/1.4 ui-monospace, Menlo, monospace; color: var(--s400); }
	.sw__u { font-size: .75rem; color: var(--s600); margin-top: .125rem; }
	.demo { display: grid; gap: 1rem; grid-template-columns: 1fr; }
	@media (min-width: 820px) { .demo { grid-template-columns: repeat(2, minmax(0,1fr)); } }
	/* the wash and the orbs, drawn with the theme's own values */
	.wash { position: relative; overflow: hidden; border-radius: 1.5rem; min-height: 11rem;
		background: linear-gradient(140deg, rgba(190,218,227,.35), #fff 45%, rgba(254,213,207,.4)); }
	.orb { position: absolute; border-radius: 9999px; filter: blur(64px); pointer-events: none; }
	.b1 { background: rgba(190,218,227,.45); right: -2rem; top: -2rem; height: 8rem; width: 8rem; }
	.b2 { background: rgba(254,213,207,.5); left: 22%; bottom: -2.5rem; height: 7rem; width: 7rem; }
	.frame { position: relative; background: rgba(255,255,255,.72); backdrop-filter: blur(8px);
		border: 1px solid rgba(226,232,240,.9); border-radius: 1.5rem; padding: 1.25rem;
		box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(45,88,102,.14); }
	.tints { display: grid; gap: .625rem; grid-template-columns: repeat(2, 1fr); }
	.tint { border-radius: 1rem; padding: .75rem .875rem; border: 1px solid transparent;
		font: 800 .75rem/1.3 ui-monospace, Menlo, monospace; }
	.meta { display: grid; gap: .5rem 1.25rem; grid-template-columns: auto 1fr; font-size: .8125rem; }
	.meta dt { color: var(--s400); font-weight: 600; }
	.meta dd { margin: 0; color: var(--s700); }
	code { font: 600 .8125em ui-monospace, Menlo, monospace; background: var(--s100); padding: .1rem .3rem; border-radius: .25rem; color: var(--s700); }
</style>
</head>
<body>
<script src="../app-ui/drag.js"></script>
<script src="../app-ui/dock.js"></script>
<script src="../app-ui/feedback.js" defer></script>
<script type="module">
import { T } from './marks.js';
import { card, column, el, head } from './brand-shell.js';

const body = column();

body.appendChild(head({
	title: 'Palette & theme',
	lede: `The marketing surface had <b>no theme</b>: colours were Tailwind arbitrary values written per
		class — <code>bg-[#FED5CF]</code>, <code>text-[#c45e38]</code> — across five files, so changing the
		brand was a find-and-replace with no list of what had to change. Everything below is
		read off <code>prototypes/calendar-ui/</code>: the tokens, the hero wash, the four orbs, the
		four card tints, the glass frame, the shadows and the 150ms transition. It now lives in
		<code>src/lib/marketing/theme.css</code>.`
}));

/* ── the palette ─────────────────────────────────────────────────────────── */
const GROUPS = [
	{
		id: 'paper', title: 'Paper', why: 'The calendar sits on warm paper, not white, and the glass frame is 72% white over it.',
		sw: [
			['canvas', T.canvas, 'the page', 'var(--mp-canvas)'],
			['surface', '#ffffff', 'cards, the focus gap', 'var(--mp-surface)'],
			['glass', 'rgba(255,255,255,.72)', 'the calendar frame', 'var(--mp-glass)'],
			['hairline', 'rgba(226,232,240,.9)', 'frame border', 'var(--mp-hairline)']
		]
	},
	{
		id: 'brand', title: 'Brand', why: 'Terracotta. Not the app’s #dd5822 — that is the open decision, named below.',
		sw: [
			['brand', T.terracotta, 'buttons, links, the mark', 'var(--mp-brand)'],
			['brand-hover', T.terracottaHover, 'hover only', 'var(--mp-brand-hover)'],
			['brand-ink', T.peachInk, 'text on peach', 'var(--mp-peach-ink)'],
			['brand-shadow', 'rgba(196,94,56,.3)', 'the button glow', 'var(--mp-brand-shadow)']
		]
	},
	{
		id: 'tints', title: 'The four tints', why: 'Blush and peach are the brand’s; blue and mint are data; lavender is the fifth and barely used.',
		sw: [
			['blush', T.blush, 'warm, brand', 'var(--mp-blush)'],
			['peach', T.peach, 'warm, accent', 'var(--mp-peach)'],
			['blue', T.blue, 'cool, data', 'var(--mp-blue)'],
			['mint', T.mint, 'cool, done', 'var(--mp-mint)'],
			['lavender', '#d3c7e6', 'the fifth', 'var(--mp-lavender)']
		]
	},
	{
		id: 'ink', title: 'Ink', why: 'The slate ramp. Five steps is all the calendar page ever uses.',
		sw: [
			['ink', T.s900, 'headlines', 'var(--mp-ink)'],
			['ink-soft', '#334155', 'body', 'var(--mp-ink-soft)'],
			['ink-muted', '#64748b', 'secondary', 'var(--mp-ink-muted)'],
			['ink-faint', '#94a3b8', 'meta, captions', 'var(--mp-ink-faint)'],
			['ink-line', '#cbd5e1', 'dividers', 'var(--mp-ink-line)'],
			['ink-wash', '#f1f5f9', 'segmented tracks', 'var(--mp-ink-wash)']
		]
	},
	{
		id: 'warm', title: 'The app’s warm ramp', why: 'Kept because theme_color is still #dd5822. This is the second orange, held side by side rather than hidden.',
		sw: [
			['warm-100', '#fdede0', 'selected pill', 'var(--mp-warm-100)'],
			['warm-300', '#f5be92', 'cell hover', 'var(--mp-warm-300)'],
			['warm-500', '#e87539', 'focus ring', 'var(--mp-warm-500)'],
			['warm-600', '#dd5822', 'theme_color TODAY', 'var(--mp-warm-600)'],
			['warm-700', '#b8441c', 'hover', 'var(--mp-warm-700)']
		]
	},
	{
		id: 'status', title: 'Status', why: 'The calendar page reaches for an amber and a red that are in no palette here. Named once so a page can say “due today”.',
		sw: [
			['warn-bg', '#fffbeb', 'due today', 'var(--mp-warn-bg)'],
			['warn', '#b45309', 'overdue text', 'var(--mp-warn)'],
			['warn-deep', '#92400e', 'overdue strong', 'var(--mp-warn-deep)'],
			['danger', '#dc2626', 'destructive', 'var(--mp-danger)']
		]
	}
];

GROUPS.forEach((g) => {
	const n = el('div', 'grp');
	n.setAttribute('data-fb', 'theme-' + g.id);
	n.setAttribute('data-fb-label', g.title);
	n.innerHTML = `
		<div class="grp__h"><h2>${g.title}</h2><span class="hint">${g.why}</span></div>
		<div class="sw">${g.sw.map(([n, hex, use, tok]) => `
			<figure>
				<div class="sw__c" style="background:${hex}"></div>
				<div class="sw__n">${n}</div>
				<div class="sw__h">${hex}</div>
				<div class="sw__u">${use}</div>
				<div class="sw__h" style="margin-top:.125rem">${tok}</div>
			</figure>`).join('')}</div>`;
	body.appendChild(card(n.innerHTML, 'theme-' + g.id + '-card', g.title));
});

/* ── the wash and the orbs, which is the brand's signature ──────────────── */
{
	const n = el('div');
	n.setAttribute('data-fb', 'theme-wash');
	n.setAttribute('data-fb-label', 'Wash and orbs');
	n.innerHTML = `
		<div class="demo">
			<div>
				<div class="wash">
					<div class="orb b1"></div><div class="orb b2"></div>
					<div style="position:relative;padding:1.5rem">
						<div style="font-size:1.75rem;font-weight:800;letter-spacing:-.03em;color:#0f172a">Where family schedules<br>come together</div>
						<p style="margin:.5rem 0 0;font-size:.875rem;color:#64748b;max-width:26rem">Drawn with the theme’s own values — a 140° diagonal from sky through paper to blush, under two 64px-blurred orbs.</p>
					</div>
				</div>
				<dl class="meta" style="margin-top:.875rem">
					<dt>wash</dt><dd><code>--mp-wash-hero</code></dd>
					<dt>orbs</dt><dd><code>--mp-orb-blue</code> · <code>--mp-orb-blush</code> · <code>--mp-orb-mint</code> · <code>--mp-orb-peach</code></dd>
					<dt>blur</dt><dd>64px — the reason the wash reads as light rather than as a gradient</dd>
				</dl>
			</div>
			<div>
				<div class="frame">
					<div style="font:800 .75rem/1.4 ui-monospace,Menlo,monospace;color:#6b5b7b;letter-spacing:.04em;text-transform:uppercase">the glass frame</div>
					<div style="margin:.5rem 0 0;font-size:1.125rem;font-weight:800;color:#0f172a">72% white, 8px blur</div>
					<p style="margin:.375rem 0 0;font-size:.8125rem;line-height:1.6;color:#64748b">The shadow is tinted with the blue ink rather than black. That is what keeps a white card from looking grey on warm paper.</p>
					<div class="tints" style="margin-top:1rem">
						<div class="tint" style="background:linear-gradient(135deg,rgba(254,213,207,.42),#fff);color:#c45e38">blush</div>
						<div class="tint" style="background:linear-gradient(135deg,rgba(190,218,227,.42),#fff);color:#366d7e">blue</div>
						<div class="tint" style="background:linear-gradient(135deg,rgba(196,233,218,.42),#fff);color:#2d5866">mint</div>
						<div class="tint" style="background:linear-gradient(135deg,rgba(211,199,230,.42),#fff);color:#6b5b7b">lavender</div>
					</div>
				</div>
				<dl class="meta" style="margin-top:.875rem">
					<dt>frame</dt><dd><code>--mp-glass</code> · <code>--mp-hairline</code> · <code>--mp-shadow-frame</code></dd>
					<dt>tints</dt><dd>four 135° fades, each of its own tint into paper</dd>
					<dt>motion</dt><dd><code>--mp-motion: 150ms</code> on background, shadow, transform, colour — one duration, no exceptions</dd>
					<dt>focus</dt><dd><code>--mp-focus</code> — a white gap, then a ring. The gap is what makes it visible on a tint.</dd>
				</dl>
			</div>
		</div>`;
	body.appendChild(card(n.innerHTML, 'theme-wash-card', 'Wash and orbs'));
}

/* ── the decision ────────────────────────────────────────────────────────── */
{
	const n = el('div');
	n.setAttribute('data-fb', 'theme-decision');
	n.setAttribute('data-fb-label', 'The second orange');
	n.innerHTML = `
		<div style="font-size:1rem;font-weight:800;color:var(--s900);margin-bottom:.5rem">The one thing the theme cannot decide</div>
		<p class="hint" style="margin:0 0 .75rem;max-width:46rem">The theme names both oranges rather than picking one, because both are
		live and the difference is visible side by side.</p>
		<div class="tints" style="grid-template-columns:repeat(2,1fr);max-width:32rem">
			<div class="tint" style="background:#c45e38;color:#fff">--mp-brand · #c45e38<br><span style="font-weight:500;opacity:.85">the calendar prototype, the marketing pages</span></div>
			<div class="tint" style="background:#dd5822;color:#fff">--mp-warm-600 · #dd5822<br><span style="font-weight:500;opacity:.85">theme_color, the app chrome</span></div>
		</div>
		<p class="hint" style="margin:.75rem 0 0">The theme uses <b>#c45e38</b>, because the calendar prototype page is
		where the design language already lives and it is the surface a visitor sees first.
		Adopting it for the app is a follow-up, not a rename: <code>theme_color</code>,
		<code>tailwind.config.js</code> and the <code>::selection</code> in
		<code>app.css</code> — which is a sky blue matching no palette in this repo — all move together
		or not at all.</p>`;
	body.appendChild(card(n.innerHTML, 'theme-decision-card', 'The second orange'));
}

document.body.appendChild(body);
</script>
</body>
</html>
